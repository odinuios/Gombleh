<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat Pro - Tabs</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Helvetica, sans-serif; background-color: #d1d7db; display: flex; height: 100vh; justify-content: center; align-items: center; }
        
        /* Layar Login */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #f0f2f5; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .btn-google { background: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 5px; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: bold; margin-top: 20px; margin-left: auto; margin-right: auto; }
        .hidden { display: none !important; }

        /* Container Utama */
        .app-container { display: flex; width: 100%; max-width: 1400px; height: 100vh; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); margin: 0 auto; position: relative; overflow: hidden; }
        
        /* Sidebar (Kiri / Navigasi) */
        .sidebar { flex: 0 0 30%; min-width: 320px; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; background: #fff; position: relative; }
        .header { height: 60px; background-color: #f0f2f5; display: flex; align-items: center; padding: 0 15px; font-weight: 600; color: #41525d; border-bottom: 1px solid #ddd; flex-shrink: 0; }
        
        /* Area Konten Tab */
        .tab-content-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .tab-pane { display: none; flex-direction: column; height: 100%; }
        .tab-pane.active { display: flex; }

        /* Menu / Form Inputs */
        .menu-box { padding: 15px; background: #fff; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; }
        .menu-row { display: flex; gap: 5px; }
        .menu-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 14px; }
        .menu-row button { padding: 10px 15px; background: #00a884; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .menu-row button:hover { background: #008f6f; }

        /* List Items */
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #f2f2f2; cursor: pointer; }
        .chat-item:hover { background-color: #f5f6f6; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background-color: #dfe5e7; margin-right: 15px; flex-shrink: 0; object-fit: cover; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 500; font-size: 16px; margin: 0 0 3px 0; color: #111b21; }
        .chat-preview { font-size: 13px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }

        /* Navigasi Bawah (Tabs) */
        .tab-nav { display: flex; background: #f0f2f5; border-top: 1px solid #ddd; height: 60px; flex-shrink: 0; }
        .tab-btn { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: none; border: none; cursor: pointer; color: #54656f; font-size: 12px; font-weight: 500; gap: 4px; transition: 0.2s; }
        .tab-btn:hover { background: #e9edef; }
        .tab-btn.active { color: #00a884; font-weight: bold; }
        .tab-btn .icon { font-size: 20px; }

        /* Profil Tab Khusus */
        .profile-container { padding: 20px; text-align: center; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #00a884; margin-bottom: 15px; cursor: pointer; }
        .profile-btn { background: #00a884; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        .logout-btn { background: #d9534f; margin-top: 20px; }

        /* Panggilan Placeholder */
        .calls-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #667781; text-align: center; padding: 20px; }

        /* Ruang Obrolan (Kanan) */
        .chat-main { flex: 1 1 auto; display: flex; flex-direction: column; background-color: #efeae2; width: 100%; overflow: hidden; }
        .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: contain; }
        
        /* Gelembung Pesan */
        .message { max-width: 65%; padding: 8px 12px; border-radius: 7px; font-size: 14px; position: relative; line-height: 1.4; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); word-wrap: break-word; }
        .message.received { background-color: #fff; align-self: flex-start; border-top-left-radius: 0; }
        .message.sent { background-color: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .msg-sender { font-size: 11px; font-weight: bold; color: #00766c; margin-bottom: 2px; }
        .msg-time { font-size: 11px; color: #667781; float: right; margin: 6px 0 -4px 10px; }
        
        /* Media dalam Pesan */
        .message img { max-width: 100%; border-radius: 5px; cursor: pointer; margin-bottom: 5px; display: block; }
        .message audio { max-width: 200px; height: 35px; outline: none; margin-bottom: 5px; }
        .message a { color: #027eb5; text-decoration: none; font-weight: bold; }

        /* Area Input */
        .chat-input-area { background-color: #f0f2f5; display: flex; align-items: center; padding: 10px 15px; gap: 10px; }
        .chat-input-area input[type="text"] { flex: 1; border: none; padding: 12px 15px; border-radius: 8px; outline: none; font-size: 15px; }
        
        .action-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #54656f; padding: 5px; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .action-btn:hover { background: #d9d9d9; }
        .recording { color: red !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        .btn-send { background-color: #00a884; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Mobile View - Tabs become main nav */
        @media (max-width: 768px) {
            .sidebar { width: 100%; min-width: 100%; flex: 1; }
            .chat-main { position: absolute; top: 0; left: 100%; width: 100%; height: 100%; transition: left 0.3s ease; z-index: 10; }
            .chat-main.active-mobile { left: 0; }
            #btn-back-mobile { display: block !important; margin-right: 15px; font-size: 20px; background: none; border: none; cursor: pointer; }
        }
        #btn-back-mobile { display: none; }
    </style>
</head>
<body>

    <!-- Layar Login -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Web Chat Pro</h2>
            <p>Silakan masuk untuk mulai bertukar pesan.</p>
            <button id="btn-login" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
                Login dengan Akun Google
            </button>
        </div>
    </div>

    <!-- Aplikasi Utama -->
    <div id="app-container" class="app-container hidden">
        
        <!-- Sidebar (Kiri) / Navigasi -->
        <div class="sidebar">
            <div class="tab-content-area">
                
                <!-- TAB 1: CHATS -->
                <div id="tab-chats" class="tab-pane active">
                    <div class="header">
                        <span style="font-size: 20px; font-weight: bold;">Chats</span>
                    </div>
                    <div class="chat-list" id="chat-list-container">
                        <!-- Obrolan aktif dimuat di sini -->
                    </div>
                </div>

                <!-- TAB 2: KONTAK & GRUP -->
                <div id="tab-contacts" class="tab-pane">
                    <div class="header">
                        <span style="font-size: 20px; font-weight: bold;">Kontak & Grup Baru</span>
                    </div>
                    <div class="menu-box">
                        <div class="menu-row">
                            <input type="email" id="add-email-input" placeholder="Email teman..." autocomplete="off">
                            <button id="btn-add-contact">+ Kontak</button>
                        </div>
                        <div class="menu-row">
                            <input type="text" id="group-name-input" placeholder="Nama Grup Baru..." autocomplete="off">
                            <button id="btn-create-group" style="background:#005c4b;">+ Grup</button>
                        </div>
                    </div>
                    <div class="chat-list" id="contact-list-container">
                        <!-- Daftar Kontak dimuat di sini -->
                    </div>
                </div>

                <!-- TAB 3: PANGGILAN -->
                <div id="tab-calls" class="tab-pane">
                    <div class="header">
                        <span style="font-size: 20px; font-weight: bold;">Panggilan</span>
                    </div>
                    <div class="calls-placeholder">
                        <span style="font-size: 40px; margin-bottom: 10px;">📞</span>
                        <h3>Riwayat Panggilan Kosong</h3>
                        <p>Fitur panggilan akan segera hadir pada pembaruan berikutnya.</p>
                    </div>
                </div>

                <!-- TAB 4: PROFIL -->
                <div id="tab-profile" class="tab-pane">
                    <div class="header">
                        <span style="font-size: 20px; font-weight: bold;">Profil Anda</span>
                    </div>
                    <div class="profile-container">
                        <input type="file" id="profile-photo-input" style="display: none;" accept="image/*">
                        <img src="https://via.placeholder.com/120" id="profile-avatar-preview" class="profile-avatar" title="Klik untuk ganti foto">
                        <p style="font-size: 12px; color: #667; margin-top: -5px;">(Klik foto untuk mengubah)</p>
                        
                        <div class="menu-row" style="margin-top: 15px;">
                            <input type="text" id="profile-name-input" placeholder="Nama Tampilan">
                        </div>
                        
                        <button id="btn-save-profile" class="profile-btn">Simpan Profil</button>
                        <button id="btn-logout" class="profile-btn logout-btn">Keluar (Logout)</button>
                    </div>
                </div>

            </div>

            <!-- Tab Navigation Bar (Bawah) -->
            <div class="tab-nav">
                <button class="tab-btn active" data-tab="tab-chats">
                    <span class="icon">💬</span>
                    <span>Chats</span>
                </button>
                <button class="tab-btn" data-tab="tab-contacts">
                    <span class="icon">👥</span>
                    <span>Kontak</span>
                </button>
                <button class="tab-btn" data-tab="tab-calls">
                    <span class="icon">📞</span>
                    <span>Panggilan</span>
                </button>
                <button class="tab-btn" data-tab="tab-profile">
                    <span class="icon">⚙️</span>
                    <span>Profil</span>
                </button>
            </div>
        </div>

        <!-- Ruang Obrolan (Kanan) -->
        <div class="chat-main" id="chat-main-area">
            <div class="header">
                <button id="btn-back-mobile">←</button>
                <div id="chat-main-header">Pilih kontak atau grup untuk mulai chat</div>
            </div>
            <div class="chat-history"></div>
            
            <div class="chat-input-area">
                <input type="file" id="file-input" style="display: none;" accept="image/*, .pdf, .doc, .docx, .xls, .xlsx, .zip">
                <button class="action-btn" id="btn-attach" title="Kirim File/Foto">📎</button>
                <button class="action-btn" id="btn-location" title="Kirim Lokasi">📍</button>
                
                <input type="text" id="message-input" placeholder="Ketik pesan..." autocomplete="off"/>
                
                <button class="action-btn" id="btn-mic" title="Rekam Suara">🎤</button>
                <button class="btn-send" id="btn-send">Kirim</button>
            </div>
        </div>
    </div>

    <!-- Script Firebase & Logika Aplikasi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, where, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCx4_E64FBUDyo4RzDDWMLklRlZMvMUlFM",
            authDomain: "gombleh-9dea6.firebaseapp.com",
            projectId: "gombleh-9dea6",
            storageBucket: "gombleh-9dea6.firebasestorage.app",
            messagingSenderId: "1034286098492",
            appId: "1:1034286098492:web:87c81098f5ad465e187b39",
            measurementId: "G-L8W6KQPCY4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dvhcfc37o/auto/upload"; 
        const CLOUDINARY_PRESET = "gombleh";

        let currentUser = null;
        let activeTargetId = null; 
        let activeTargetType = 'private'; 
        let unsubscribeChat = null;

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const chatListContainer = document.getElementById('chat-list-container');
        const contactListContainer = document.getElementById('contact-list-container');
        const chatHistory = document.querySelector('.chat-history');
        const chatMainHeader = document.getElementById('chat-main-header');
        const inputMessage = document.getElementById('message-input');
        const chatMainArea = document.getElementById('chat-main-area');

        // ==== LOGIKA TAB NAVIGASI ====
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabPanes = document.querySelectorAll('.tab-pane');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Hapus aktif dari semua tombol dan panel
                tabBtns.forEach(b => b.classList.remove('active'));
                tabPanes.forEach(p => p.classList.remove('active'));

                // Aktifkan yang diklik
                btn.classList.add('active');
                const targetPane = document.getElementById(btn.getAttribute('data-tab'));
                targetPane.classList.add('active');
            });
        });

        // Mobile Back Button
        document.getElementById('btn-back-mobile').addEventListener('click', () => {
            chatMainArea.classList.remove('active-mobile');
        });

        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio diblokir.");
            }
        }

        // ================= AUTHENTICATION =================
        document.getElementById('btn-login').addEventListener('click', () => {
            setPersistence(auth, browserLocalPersistence)
            .then(() => signInWithPopup(auth, provider))
            .catch(error => alert("Gagal login: " + error.message));
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => { location.reload(); });
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');

                // Set Data Profil
                document.getElementById('profile-avatar-preview').src = user.photoURL || 'https://via.placeholder.com/120';
                document.getElementById('profile-name-input').value = user.displayName || '';

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid, name: user.displayName, email: user.email, photoURL: user.photoURL
                }, { merge: true });
                
                loadSidebarItems();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        });

        // ================= KONTROL PROFIL =================
        const profilePhotoInput = document.getElementById('profile-photo-input');
        const profileAvatarPreview = document.getElementById('profile-avatar-preview');
        let newProfilePhotoUrl = null;

        profileAvatarPreview.addEventListener('click', () => profilePhotoInput.click());

        profilePhotoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            profileAvatarPreview.style.opacity = '0.5';
            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_PRESET);
                const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.secure_url) {
                    newProfilePhotoUrl = data.secure_url;
                    profileAvatarPreview.src = newProfilePhotoUrl;
                }
            } catch (err) {
                alert("Gagal mengunggah foto.");
            }
            profileAvatarPreview.style.opacity = '1';
        });

        document.getElementById('btn-save-profile').addEventListener('click', async () => {
            const newName = document.getElementById('profile-name-input').value.trim();
            if (!newName) return alert("Nama tidak boleh kosong.");

            const btnSave = document.getElementById('btn-save-profile');
            btnSave.innerText = "Menyimpan...";
            btnSave.disabled = true;

            try {
                const updateData = { displayName: newName };
                if (newProfilePhotoUrl) updateData.photoURL = newProfilePhotoUrl;

                // Update Firebase Auth
                await updateProfile(auth.currentUser, updateData);
                
                // Update Firestore DB
                await setDoc(doc(db, "users", currentUser.uid), {
                    name: newName,
                    photoURL: newProfilePhotoUrl || currentUser.photoURL
                }, { merge: true });

                alert("Profil berhasil diperbarui!");
                currentUser = auth.currentUser; // Refresh local user object
            } catch (err) {
                alert("Gagal memperbarui profil.");
            }
            btnSave.innerText = "Simpan Profil";
            btnSave.disabled = false;
        });

        // ================= KONTROL KONTAK & GRUP =================
        document.getElementById('btn-add-contact').addEventListener('click', async () => {
            const email = document.getElementById('add-email-input').value.trim().toLowerCase();
            if (!email) return;
            if (email === currentUser.email) return alert("Tidak bisa menambah email sendiri.");

            try {
                const q = query(collection(db, "users"), where("email", "==", email));
                const snapshot = await getDocs(q);
                if (snapshot.empty) return alert("Email belum terdaftar.");

                let friendData;
                snapshot.forEach(doc => friendData = doc.data());

                await setDoc(doc(db, "users", currentUser.uid, "contacts", friendData.uid), friendData);
                alert("Kontak ditambahkan!");
                document.getElementById('add-email-input').value = '';
            } catch (error) {
                alert("Gagal menambah kontak.");
            }
        });

        document.getElementById('btn-create-group').addEventListener('click', async () => {
            const groupName = document.getElementById('group-name-input').value.trim();
            if (!groupName) return alert("Masukkan nama grup.");

            try {
                const groupRef = doc(collection(db, "groups"));
                await setDoc(groupRef, {
                    groupId: groupRef.id,
                    groupName: groupName,
                    createdBy: currentUser.uid,
                    members: [currentUser.uid], 
                    createdAt: serverTimestamp()
                });

                alert("Grup berhasil dibuat!");
                document.getElementById('group-name-input').value = '';
            } catch (error) {
                alert("Gagal membuat grup.");
            }
        });

        // Memuat Kontak dan Grup ke Tab masing-masing
        function loadSidebarItems() {
            chatListContainer.innerHTML = '';
            contactListContainer.innerHTML = '';

            // 1. Muat Kontak Pribadi (Masuk ke Tab Kontak dan Tab Chat)
            const contactsRef = collection(db, "users", currentUser.uid, "contacts");
            onSnapshot(contactsRef, (snapshot) => {
                document.querySelectorAll('.item-private').forEach(el => el.remove());

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const createItem = () => {
                        const div = document.createElement('div');
                        div.className = 'chat-item item-private';
                        div.innerHTML = `
                            <img src="${data.photoURL || 'https://via.placeholder.com/45'}" class="avatar">
                            <div class="chat-info">
                                <p class="chat-name">${data.name}</p>
                                <p class="chat-preview">${data.email}</p>
                            </div>
                        `;
                        div.addEventListener('click', () => {
                            activeTargetId = data.uid;
                            activeTargetType = 'private';
                            chatMainHeader.innerHTML = `<img src="${data.photoURL || 'https://via.placeholder.com/45'}" style="width:35px; height:35px; border-radius:50%; margin-right:10px; object-fit:cover;"> ${data.name}`;
                            loadChatRoom();
                            if (window.innerWidth <= 768) chatMainArea.classList.add('active-mobile');
                        });
                        return div;
                    };

                    contactListContainer.appendChild(createItem());
                    chatListContainer.appendChild(createItem()); // Tampil di Chats juga
                });
            });

            // 2. Muat Grup (Masuk ke Tab Kontak dan Tab Chat)
            const groupsRef = collection(db, "groups");
            onSnapshot(groupsRef, (snapshot) => {
                document.querySelectorAll('.item-group').forEach(el => el.remove());

                snapshot.forEach((docSnap) => {
                    const gData = docSnap.data();
                    if (gData.members && gData.members.includes(currentUser.uid)) {
                        const createGroupItem = () => {
                            const div = document.createElement('div');
                            div.className = 'chat-item item-group';
                            div.innerHTML = `
                                <div class="avatar" style="background:#00a884; color:white;">👥</div>
                                <div class="chat-info">
                                    <p class="chat-name">${gData.groupName}</p>
                                    <p class="chat-preview">Grup Bersama</p>
                                </div>
                            `;
                            div.addEventListener('click', () => {
                                activeTargetId = gData.groupId;
                                activeTargetType = 'group';
                                chatMainHeader.innerHTML = `👥 ${gData.groupName}`;
                                loadChatRoom();
                                if (window.innerWidth <= 768) chatMainArea.classList.add('active-mobile');
                            });
                            return div;
                        };
                        
                        contactListContainer.appendChild(createGroupItem());
                        chatListContainer.appendChild(createGroupItem());
                    }
                });
            });
        }

        // ================= OBROLAN =================
        function getChatId() {
            if (activeTargetType === 'private') {
                return currentUser.uid < activeTargetId ? `${currentUser.uid}_${activeTargetId}` : `${activeTargetId}_${currentUser.uid}`;
            } else {
                return activeTargetId; 
            }
        }

        function loadChatRoom() {
            if (unsubscribeChat) unsubscribeChat();
            const chatId = getChatId();
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));

            let isInitialLoad = true;

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                chatHistory.innerHTML = ''; 
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    const isMine = data.senderId === currentUser.uid;
                    div.className = isMine ? 'message sent' : 'message received';
                    
                    const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...';
                    
                    let content = '';
                    if (data.type === 'text') content = data.text;
                    else if (data.type === 'image') content = `<img src="${data.url}" onclick="window.open('${data.url}', '_blank')"><br>${data.text || ''}`;
                    else if (data.type === 'file') content = `📄 <a href="${data.url}" target="_blank">Unduh File (${data.fileName})</a>`;
                    else if (data.type === 'location') content = `📍 <a href="https://www.google.com/maps/search/?api=1&query=${data.lat},${data.lng}" target="_blank">Lihat Lokasi di Peta</a>`;
                    else if (data.type === 'audio') content = `<audio controls src="${data.url}"></audio>`;

                    let senderLabel = '';
                    if (activeTargetType === 'group' && !isMine) {
                        senderLabel = `<div class="msg-sender">${data.senderName || 'Anggota'}</div>`;
                    }

                    div.innerHTML = `${senderLabel}${content} <span class="msg-time">${time}</span>`;
                    chatHistory.appendChild(div);
                });

                if (!isInitialLoad && !snapshot.empty) {
                    const lastDoc = snapshot.docs[snapshot.docs.length - 1].data();
                    if (lastDoc.senderId !== currentUser.uid) playNotificationSound();
                }

                isInitialLoad = false;
                chatHistory.scrollTop = chatHistory.scrollHeight;
            });
        }

        async function sendMessageToDb(payload) {
            if (!activeTargetId) return alert("Pilih kontak atau grup terlebih dahulu!");
            const chatId = getChatId();
            try {
                await addDoc(collection(db, "chats", chatId, "messages"), {
                    ...payload,
                    senderId: currentUser.uid,
                    senderName: currentUser.displayName,
                    timestamp: serverTimestamp()
                });
            } catch (error) {
                console.error("Gagal kirim:", error);
            }
        }

        // Kirim Pesan Teks & Ekstraksi File/Media (Sama seperti sebelumnya)
        document.getElementById('btn-send').addEventListener('click', () => {
            const text = inputMessage.value.trim();
            if (text) {
                sendMessageToDb({ type: 'text', text: text });
                inputMessage.value = '';
                inputMessage.focus();
            }
        });
        inputMessage.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('btn-send').click(); });

        const btnAttach = document.getElementById('btn-attach');
        const fileInput = document.getElementById('file-input');
        btnAttach.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            btnAttach.style.opacity = '0.5';
            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_PRESET);
                const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.secure_url) {
                    const type = file.type.startsWith('image/') ? 'image' : 'file';
                    await sendMessageToDb({ type: type, url: data.secure_url, fileName: file.name, text: '' });
                }
            } catch (error) {
                alert("Gagal mengunggah file.");
            }
            btnAttach.style.opacity = '1';
            fileInput.value = '';
        });

        document.getElementById('btn-location').addEventListener('click', () => {
            if (!activeTargetId) return alert("Pilih tujuan chat dulu!");
            if (!navigator.geolocation) return alert("GPS tidak didukung.");
            
            navigator.geolocation.getCurrentPosition((position) => {
                sendMessageToDb({ type: 'location', lat: position.coords.latitude, lng: position.coords.longitude });
            }, () => alert("Gagal mengambil lokasi."));
        });

        const btnMic = document.getElementById('btn-mic');
        let mediaRecorder, audioChunks = [], isRecording = false;

        btnMic.addEventListener('click', async () => {
            if (!activeTargetId) return alert("Pilih tujuan chat dulu!");
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        audioChunks = [];
                        btnMic.style.opacity = '0.5';
                        const formData = new FormData();
                        formData.append('file', audioBlob);
                        formData.append('upload_preset', CLOUDINARY_PRESET);
                        formData.append('resource_type', 'auto'); 

                        try {
                            const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                            const data = await response.json();
                            if (data.secure_url) await sendMessageToDb({ type: 'audio', url: data.secure_url });
                        } catch (err) { alert("Gagal mengirim suara."); }
                        btnMic.style.opacity = '1';
                        stream.getTracks().forEach(track => track.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btnMic.classList.add('recording'); 
                } catch (err) { alert("Gagal mengakses mikrofon."); }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btnMic.classList.remove('recording');
            }
        });
    </script>
</body>
</html>
