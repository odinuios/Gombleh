<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gibah</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00a884">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Helvetica, sans-serif; background-color: #d1d7db; display: flex; height: 100vh; height: 100dvh; justify-content: center; align-items: center; overflow: hidden; position: relative;}
        
        /* Banner In-App (Foreground Notifications) */
        .banner-container { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none;}
        .in-app-banner { background: #fff; border-left: 5px solid #00a884; box-shadow: 0 4px 15px rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; pointer-events: auto; animation: slideDown 0.3s ease forwards, fadeOut 0.5s ease 4s forwards; cursor: pointer;}
        .in-app-banner img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .in-app-banner .b-info { flex: 1; }
        .in-app-banner h4 { margin: 0 0 3px 0; font-size: 14px; color: #111b21; }
        .in-app-banner p { margin: 0; font-size: 12px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;}
        
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-20px); } }

        /* Layar Login */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; background: #f0f2f5; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .login-logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 2px solid #00a884; }
        .btn-google { background: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 5px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; margin-top: 20px; width: 100%; transition: 0.2s; }
        .btn-google:hover { background: #3367d6; }
        .hidden { display: none !important; }

        /* Container Utama */
        .app-container { display: flex; width: 100%; max-width: 1400px; height: 100vh; height: 100dvh; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); margin: 0 auto; position: relative; overflow: hidden; }
        
        /* Sidebar & Header */
        .sidebar { flex: 0 0 30%; min-width: 320px; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; background: #fff; position: relative; height: 100%; overflow: hidden; }
        .header { height: 60px; background-color: #f0f2f5; display: flex; align-items: center; padding: 0 15px; font-weight: 600; color: #41525d; border-bottom: 1px solid #ddd; flex-shrink: 0; }
        .tab-content-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; height: calc(100% - 60px); }
        .tab-pane { display: none; flex-direction: column; height: 100%; }
        .tab-pane.active { display: flex; }

        /* Menu / Form Inputs */
        .menu-box { padding: 15px; background: #fff; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .menu-row { display: flex; gap: 5px; }
        .menu-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 14px; }
        .menu-row button { padding: 10px 15px; background: #00a884; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        
        /* List Items */
        .list-container { flex: 1; overflow-y: auto; }
        .list-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #f2f2f2; cursor: pointer; position: relative;}
        .list-item:hover { background-color: #f5f6f6; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background-color: #dfe5e7; margin-right: 15px; flex-shrink: 0; object-fit: cover; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; font-size: 20px;}
        .info { flex: 1; overflow: hidden; }
        .name { font-weight: 500; font-size: 16px; margin: 0 0 3px 0; color: #111b21; }
        .preview { font-size: 13px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
        .request-actions { display: flex; gap: 5px; }
        .btn-acc { background: #00a884; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .btn-rej { background: #d9534f; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }

        /* Navigasi Bawah (Tabs) */
        .tab-nav { display: flex; background: #f0f2f5; border-top: 1px solid #ddd; height: 60px; flex-shrink: 0; width: 100%; z-index: 5; }
        .tab-btn { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: none; border: none; cursor: pointer; color: #54656f; font-size: 12px; font-weight: 500; gap: 4px; transition: 0.2s; position: relative;}
        .tab-btn:hover { background: #e9edef; }
        .tab-btn.active { color: #00a884; font-weight: bold; }
        .badge { position: absolute; top: 5px; right: 15px; background: #d9534f; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold; display: none; }

        /* Profil */
        .profile-container { padding: 20px; text-align: center; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #00a884; margin-bottom: 15px; cursor: pointer; }
        .profile-btn { background: #00a884; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        .logout-btn { background: #d9534f; margin-top: 20px; }

        /* Ruang Obrolan */
        .chat-main { flex: 1 1 auto; display: flex; flex-direction: column; background-color: #f0f2f5; width: 100%; height: 100%; overflow: hidden; position: relative;}
        #chat-empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; text-align: center; color: #667781; background-color: #f0f2f5; }
        #chat-empty-state h1 { font-weight: 300; margin-bottom: 10px; color: #41525d; }
        #chat-active-state { display: none; flex-direction: column; height: 100%; width: 100%; background-color: #efeae2; }
        .header-actions { margin-left: auto; display: flex; gap: 5px; }

        .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: contain; }
        .message { max-width: 65%; padding: 8px 12px; border-radius: 7px; font-size: 14px; position: relative; line-height: 1.4; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); word-wrap: break-word; }
        .message.received { background-color: #fff; align-self: flex-start; border-top-left-radius: 0; }
        .message.sent { background-color: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .msg-sender { font-size: 11px; font-weight: bold; color: #00766c; margin-bottom: 2px; }
        .msg-time-container { display: flex; align-items: center; justify-content: flex-end; margin: 4px 0 -4px 10px; float: right; gap: 4px; }
        .msg-time { font-size: 11px; color: #667781; }
        .msg-status { font-size: 11px; font-weight: bold; }
        .message img { max-width: 100%; border-radius: 5px; cursor: pointer; margin-bottom: 5px; display: block; }
        
        .chat-input-area { background-color: #f0f2f5; display: flex; align-items: center; padding: 10px 15px; gap: 10px; flex-shrink: 0; }
        .chat-input-area input[type="text"] { flex: 1; border: none; padding: 12px 15px; border-radius: 8px; outline: none; font-size: 15px; }
        .action-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #54656f; padding: 5px; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .btn-send { background-color: #00a884; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Modal Generik */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; background: rgba(0,0,0,0.5); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal-box { background: white; width: 90%; max-width: 350px; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; max-height: 80vh; }
        .modal-header { padding: 15px; background: #00a884; color: white; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .modal-close { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .modal-content { flex: 1; overflow-y: auto; padding: 10px 0; }

        /* Modal Panggilan */
        .call-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; background: rgba(0,0,0,0.9); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        .call-avatar { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 20px; object-fit: cover; border: 3px solid #00a884; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(0, 168, 132, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0); } }
        .call-modal h2 { margin: 0 0 10px 0; font-size: 24px; font-weight: 500; }
        .call-actions { display: flex; gap: 30px; margin-top: 20px;}
        .btn-call { border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .btn-call:hover { transform: scale(1.1); }
        .btn-answer { background-color: #00a884; }
        .btn-reject { background-color: #d9534f; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; min-width: 100%; flex: 1; height: 100%; }
            .chat-main { position: absolute; top: 0; left: 100%; width: 100%; height: 100%; transition: left 0.3s ease; z-index: 10; }
            .chat-main.active-mobile { left: 0; }
            #btn-back-mobile { display: block !important; margin-right: 15px; font-size: 20px; background: none; border: none; cursor: pointer; color: #54656f; }
        }
        #btn-back-mobile { display: none; }
    </style>
</head>
<body>
    
    <!-- Audio Elements (Notifikasi & Ringtone) -->
    <audio id="audio-ringtone" loop src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="audio-notif" src="https://assets.mixkit.co/active_storage/sfx/2854/2854-preview.mp3" preload="auto"></audio>

    <!-- Banner In-App Container -->
    <div id="banner-container" class="banner-container"></div>

    <!-- Modal Tambah Anggota Grup (Dari Daftar Kontak) -->
    <div id="group-add-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <span>Pilih Kontak</span>
                <button class="modal-close" id="btn-close-group-modal">✖</button>
            </div>
            <div class="modal-content" id="group-add-contact-list">
                <!-- List kontak di-inject di sini via JS -->
            </div>
        </div>
    </div>

    <!-- Layar Login -->
    <div id="login-screen">
        <div class="login-box">
            <img src="https://raw.githubusercontent.com/odinuios/Gombleh/refs/heads/main/icon.png" alt="Logo Gibah" class="login-logo">
            <h2>Gibah Dolo Yok</h2>
            <button id="btn-login" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
                Cuma bisa pake Google
            </button>
        </div>
    </div>

    <!-- Aplikasi Utama -->
    <div id="app-container" class="app-container hidden">
        <div class="sidebar">
            <div class="tab-content-area">
                <div id="tab-chats" class="tab-pane active">
                    <div class="header"><span style="font-size: 20px; font-weight: bold;">Chats</span></div>
                    <div class="list-container" id="chat-list-container"></div>
                </div>

                <div id="tab-contacts" class="tab-pane">
                    <div class="header"><span style="font-size: 20px; font-weight: bold;">Kontak & Grup</span></div>
                    <div class="menu-box">
                        <div class="menu-row">
                            <input type="email" id="add-email-input" placeholder="Email teman..." autocomplete="off">
                            <button id="btn-add-contact">+ Undang</button>
                        </div>
                        <div class="menu-row">
                            <input type="text" id="group-name-input" placeholder="Nama Grup..." autocomplete="off">
                            <button id="btn-create-group" style="background:#005c4b;">+ Grup</button>
                        </div>
                    </div>
                    <div class="list-container" id="contact-list-container"></div>
                </div>

                <div id="tab-notifications" class="tab-pane">
                    <div class="header"><span style="font-size: 20px; font-weight: bold;">Notifikasi</span></div>
                    <div class="list-container" id="notification-list-container">
                        <p style="text-align:center; color:#888; font-size:14px; margin-top:20px;" id="empty-notif">Tidak ada notifikasi baru.</p>
                    </div>
                </div>

                <div id="tab-profile" class="tab-pane">
                    <div class="header"><span style="font-size: 20px; font-weight: bold;">Profil Anda</span></div>
                    <div class="profile-container">
                        <input type="file" id="profile-photo-input" style="display: none;" accept="image/*">
                        <img src="https://via.placeholder.com/120" id="profile-avatar-preview" class="profile-avatar" title="Klik ganti foto">
                        <p style="font-size: 12px; color: #667; margin-top: -5px;">(Klik foto untuk mengubah)</p>
                        <div class="menu-row" style="margin-top: 15px;">
                            <input type="text" id="profile-name-input" placeholder="Nama Tampilan">
                        </div>
                        <button id="btn-save-profile" class="profile-btn">Simpan Profil</button>
                        <button id="btn-logout" class="profile-btn logout-btn">Keluar (Logout)</button>
                    </div>
                </div>
            </div>

            <div class="tab-nav">
                <button class="tab-btn active" data-tab="tab-chats"><span class="icon">💬</span><span>Chats</span></button>
                <button class="tab-btn" data-tab="tab-contacts"><span class="icon">👥</span><span>Kontak</span></button>
                <button class="tab-btn" data-tab="tab-notifications"><span class="icon">🔔</span><span>Notif</span><div class="badge" id="notif-badge">0</div></button>
                <button class="tab-btn" data-tab="tab-profile"><span class="icon">⚙️</span><span>Profil</span></button>
            </div>
        </div>

        <div class="chat-main" id="chat-main-area">
            <div id="chat-empty-state">
                <span style="font-size: 80px; color:#d1d7db; margin-bottom: 20px;">💬</span>
                <h1>Mau gibah ama sapa nih?</h1>
                <p>Kirim pesan dan lakukan panggilan.</p>
            </div>

            <div id="chat-active-state">
                <div class="header">
                    <button id="btn-back-mobile">←</button>
                    <div id="chat-main-header" style="display: flex; align-items: center; gap: 10px;"></div>
                    <div class="header-actions" id="chat-header-actions" style="display: flex; gap: 5px;">
                        <button class="action-btn" id="btn-open-group-modal" title="Tambah Anggota" style="display:none;">➕</button>
                        <button class="action-btn" id="btn-start-voice-call" title="Panggilan Suara">📞</button>
                        <button class="action-btn" id="btn-start-video-call" title="Video Call">📹</button>
                    </div>
                </div>
                
                <div class="chat-history"></div>
                
                <div class="chat-input-area">
                    <input type="file" id="file-input" style="display: none;" accept="image/*, .pdf, .zip">
                    <button class="action-btn" id="btn-attach" title="Kirim File/Foto">📎</button>
                    <input type="text" id="message-input" placeholder="Ketik pesan..." autocomplete="off"/>
                    <button class="btn-send" id="btn-send">Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals Panggilan Masuk -->
    <div id="incoming-call-modal" class="call-modal">
        <img src="https://via.placeholder.com/100" id="incoming-caller-avatar" class="call-avatar">
        <h2 id="incoming-caller-name">Seseorang</h2>
        <p id="incoming-call-type" style="color: #ccc;">Memanggil Video...</p>
        <div class="call-actions">
            <button class="btn-call btn-reject" id="btn-reject-call" title="Tolak">✖</button>
            <button class="btn-call btn-answer" id="btn-answer-call" title="Jawab">📞</button>
        </div>
    </div>

    <!-- Modal Panggilan Aktif -->
    <div id="active-call-modal" class="call-modal">
        <video id="remote-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; background: #111;"></video>
        <video id="local-video" autoplay playsinline muted style="width: 100px; height: 140px; object-fit: cover; position: absolute; top: 20px; right: 20px; border-radius: 10px; border: 2px solid white; z-index: 2; background: #000; display:none;"></video>
        <audio id="remote-audio" autoplay></audio>
        
        <div style="z-index: 3; position: relative; margin-top: auto; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; width: 100%;">
            <img src="https://via.placeholder.com/100" id="active-call-avatar" class="call-avatar" style="display:none; animation:none;">
            <h2 id="active-call-name" style="margin-bottom: 5px;">Nama</h2>
            <p id="active-call-status" style="margin-bottom: 15px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;">Memanggil...</p>
            <div class="call-actions">
                <button class="btn-call btn-reject" id="btn-end-call" title="Akhiri">☎</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, updateDoc, where, getDocs, getDoc, deleteDoc, arrayUnion, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCx4_E64FBUDyo4RzDDWMLklRlZMvMUlFM",
            authDomain: "gombleh-9dea6.firebaseapp.com",
            projectId: "gombleh-9dea6",
            storageBucket: "gombleh-9dea6.firebasestorage.app",
            messagingSenderId: "1034286098492",
            appId: "1:1034286098492:web:87c81098f5ad465e187b39"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dvhcfc37o/auto/upload"; 
        const CLOUDINARY_PRESET = "gombleh";

        let currentUser = null;
        let activeTargetId = null; 
        let activeTargetName = null;
        let activeTargetType = 'private'; 
        let unsubscribeChat = null;
        let currentCallMode = 'voice';
        
        let processedMessages = new Set(); // Mencegah notif duplikat

        // AUDIO
        const audioRingtone = document.getElementById('audio-ringtone');
        const audioNotif = document.getElementById('audio-notif');

        function playNotif() {
            audioNotif.currentTime = 0;
            audioNotif.play().catch(e => console.log("Auto-play prevented by browser."));
        }
        function playRingtone() {
            audioRingtone.currentTime = 0;
            audioRingtone.play().catch(e => console.log("Auto-play prevented."));
        }
        function stopRingtone() {
            audioRingtone.pause();
            audioRingtone.currentTime = 0;
        }

        // FUNGSI BANNER IN-APP & NATIVE
        const bannerContainer = document.getElementById('banner-container');
        function showNotification(title, body, photo = 'https://via.placeholder.com/40') {
            playNotif();
            
            // Native Browser Notification (Jika standby/minimize)
            if (Notification.permission === 'granted' && document.hidden) {
                new Notification(title, { body: body, icon: photo });
            }

            // In-App Banner (Selalu muncul saat aplikasi terbuka)
            const banner = document.createElement('div');
            banner.className = 'in-app-banner';
            banner.innerHTML = `
                <img src="${photo}">
                <div class="b-info">
                    <h4>${title}</h4>
                    <p>${body}</p>
                </div>
            `;
            banner.addEventListener('click', () => banner.remove());
            bannerContainer.appendChild(banner);
            
            // Hapus dari DOM setelah animasi selesai
            setTimeout(() => { if(bannerContainer.contains(banner)) banner.remove(); }, 4500);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./firebase-messaging-sw.js').catch(err => console.log('SW Failed: ', err));
            });
        }

        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const chatListContainer = document.getElementById('chat-list-container');
        const contactListContainer = document.getElementById('contact-list-container');
        const notificationListContainer = document.getElementById('notification-list-container');
        const chatHistory = document.querySelector('.chat-history');
        const chatMainHeader = document.getElementById('chat-main-header');
        const chatEmptyState = document.getElementById('chat-empty-state');
        const chatActiveState = document.getElementById('chat-active-state');
        const inputMessage = document.getElementById('message-input');
        const chatMainArea = document.getElementById('chat-main-area');
        const emptyNotif = document.getElementById('empty-notif');
        const notifBadge = document.getElementById('notif-badge');

        // ================= LOAD SIDEBAR, CHAT & GLOBAL LISTENER =================
        function loadSidebarItems() {

                        setupChatNotificationListener(gData.groupId, gData.groupName, 'https://via.placeholder.com/45', 'group');

                        const makeGroup = () => {
                            const d = document.createElement('div'); d.className = 'list-item item-group';
                            d.innerHTML = `<div class="avatar" style="background:#00a884; color:white;">👥</div><div class="info"><p class="name">${gData.groupName}</p><p class="preview">${gData.members.length} Anggota</p></div>`;

        // Listener Terpisah untuk Memunculkan Notifikasi Pesan Baru
        function setupChatNotificationListener(chatId, chatName, chatPhoto, type) {
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "desc"), limit(1));
            onSnapshot(q, (snapshot) => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const msgData = change.doc.data();
                        const targetCompareId = type === 'private' ? chatId.replace(currentUser.uid, '').replace('_', '') : chatId;
                        
                        // Tampilkan notifikasi jika: Bukan pesan dari diri sendiri, dan ruang chat tersebut BUKAN yang sedang dibuka
                        if (msgData.senderId !== currentUser.uid && activeTargetId !== targetCompareId) {
                            if (!processedMessages.has(change.doc.id)) {
                                processedMessages.add(change.doc.id);
                                const txt = msgData.type === 'text' ? msgData.text : (msgData.type === 'image' ? '📷 Mengirim gambar' : '📄 Mengirim dokumen');
                                const displayTitle = type === 'group' ? `${chatName} (${msgData.senderName})` : chatName;
                                showNotification(displayTitle, txt, chatPhoto);
                            }
                        }
                    }
                });
            });
        }

        function openChat(id, name, photo, type) {
            activeTargetId = id; activeTargetName = name; activeTargetType = type;
            chatEmptyState.style.display = 'none'; chatActiveState.style.display = 'flex';
            
            let avatarHtml = type === 'group' ? `<div class="avatar" style="background:#00a884; color:white; width:35px; height:35px; font-size:15px; margin:0;">👥</div>` : `<img src="${photo || 'https://via.placeholder.com/45'}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">`;
            chatMainHeader.innerHTML = `${avatarHtml} <span style="font-weight:bold; font-size: 16px;">${name}</span>`;
            
            btnOpenGroupModal.style.display = (type === 'group') ? 'block' : 'none';
            if (window.innerWidth <= 768) chatMainArea.classList.add('active-mobile');
            loadChatRoom();
        }

        function loadChatRoom() {
            if (unsubscribeChat) unsubscribeChat();
            const chatId = activeTargetType === 'private' ? (currentUser.uid < activeTargetId ? `${currentUser.uid}_${activeTargetId}` : `${activeTargetId}_${currentUser.uid}`) : activeTargetId;
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                chatHistory.innerHTML = ''; 
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const isMine = data.senderId === currentUser.uid;
                    processedMessages.add(docSnap.id); // Tandai sudah diproses agar notif tidak dobel

                    if (!isMine && data.status !== 'R') updateDoc(docSnap.ref, { status: 'R' });

                    const div = document.createElement('div');
                    div.className = isMine ? 'message sent' : 'message received';
                    const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                    
                    let content = data.text || '';
                    if (data.type === 'image') content = `<img src="${data.url}" onclick="window.open('${data.url}', '_blank')"><br>${data.text || ''}`;
                    else if (data.type === 'file') content = `📄 <a href="${data.url}" target="_blank">Unduh File (${data.fileName})</a>`;
                    
                    let senderLabel = (activeTargetType === 'group' && !isMine) ? `<div class="msg-sender">${data.senderName}</div>` : '';
                    let statusHtml = '';
                    if (isMine) {
                        const statusColor = data.status === 'R' ? '#53bdeb' : '#888';
                        statusHtml = `<span class="msg-status" style="color: ${statusColor};">${data.status === 'R' ? 'R' : 'D'}</span>`;
                    }

                    div.innerHTML = `${senderLabel}${content} <div class="msg-time-container"><span class="msg-time">${time}</span>${statusHtml}</div>`;
                    chatHistory.appendChild(div);
                });
                chatHistory.scrollTop = chatHistory.scrollHeight;
            });
        }

        document.getElementById('btn-send').addEventListener('click', () => {
            const text = inputMessage.value.trim();
            if (text && activeTargetId) {
                const chatId = activeTargetType === 'private' ? (currentUser.uid < activeTargetId ? `${currentUser.uid}_${activeTargetId}` : `${activeTargetId}_${currentUser.uid}`) : activeTargetId;
                addDoc(collection(db, "chats", chatId, "messages"), { type: 'text', text: text, senderId: currentUser.uid, senderName: currentUser.displayName, timestamp: serverTimestamp(), status: 'D' });
                inputMessage.value = ''; inputMessage.focus();
            }
        });
        inputMessage.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('btn-send').click(); });

        const btnAttach = document.getElementById('btn-attach'); const fileInput = document.getElementById('file-input');
        btnAttach.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0]; if (!file || !activeTargetId) return;
            btnAttach.style.opacity = '0.5';
            try {
                const formData = new FormData(); formData.append('file', file); formData.append('upload_preset', CLOUDINARY_PRESET);
                const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
                const data = await response.json();
                if (data.secure_url) {
                    const chatId = activeTargetType === 'private' ? (currentUser.uid < activeTargetId ? `${currentUser.uid}_${activeTargetId}` : `${activeTargetId}_${currentUser.uid}`) : activeTargetId;
                    const type = file.type.startsWith('image/') ? 'image' : 'file';
                    await addDoc(collection(db, "chats", chatId, "messages"), { type: type, url: data.secure_url, fileName: file.name, text: '', senderId: currentUser.uid, senderName: currentUser.displayName, timestamp: serverTimestamp(), status: 'D' });
                }
            } catch (error) { alert("Gagal mengunggah file."); }
            btnAttach.style.opacity = '1'; fileInput.value = '';
        });

        // ================= WEBRTC PANGGILAN =================
        const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };
        let pc = null; let localStream = null; let currentCallDocId = null; let callSnapshotUnsub = null;
        const modalIncoming = document.getElementById('incoming-call-modal');
        const modalActive = document.getElementById('active-call-modal');
        const remoteVideo = document.getElementById('remote-video');
        const localVideo = document.getElementById('local-video');
        const remoteAudio = document.getElementById('remote-audio');

        async function startCall(mode) {
            currentCallMode = mode; modalActive.style.display = 'flex';
            document.getElementById('active-call-name').innerText = activeTargetName;
            document.getElementById('active-call-status').innerText = mode === 'video' ? "Memanggil Video..." : "Memanggil Suara...";
            
            if (mode === 'video') { localVideo.style.display = 'block'; remoteVideo.style.display = 'block'; document.getElementById('active-call-avatar').style.display = 'none'; } 
            else { localVideo.style.display = 'none'; remoteVideo.style.display = 'none'; document.getElementById('active-call-avatar').style.display = 'block'; document.getElementById('active-call-avatar').src = 'https://via.placeholder.com/100'; }

            pc = new RTCPeerConnection(servers);
            try {
                const constraints = mode === 'video' ? { audio: true, video: true } : { audio: true, video: false };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                if (mode === 'video') localVideo.srcObject = localStream;
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            } catch (e) { alert("Gagal mengakses media!"); stopCallCleanup(); return; }

            pc.ontrack = event => { if (mode === 'video') remoteVideo.srcObject = event.streams[0]; else remoteAudio.srcObject = event.streams[0]; };

            const callDocRef = doc(collection(db, "calls")); currentCallDocId = callDocRef.id;
            const offerCandidates = collection(callDocRef, 'offerCandidates'); const answerCandidates = collection(callDocRef, 'answerCandidates');
            pc.onicecandidate = event => { if (event.candidate) addDoc(offerCandidates, event.candidate.toJSON()); };
            const offerDescription = await pc.createOffer(); await pc.setLocalDescription(offerDescription);

            const callTarget = activeTargetType === 'group' ? `GROUP_${activeTargetId}` : activeTargetId;
            await setDoc(callDocRef, { callerId: currentUser.uid, callerName: currentUser.displayName, calleeId: callTarget, callMode: mode, type: activeTargetType, offer: { type: offerDescription.type, sdp: offerDescription.sdp }, status: 'calling', timestamp: serverTimestamp() });

            callSnapshotUnsub = onSnapshot(callDocRef, (docSnap) => {
                const data = docSnap.data();
                if (data?.answer && !pc.currentRemoteDescription) pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                if (data?.status === 'answered') document.getElementById('active-call-status').innerText = "Terhubung";
                if (data?.status === 'ended' || data?.status === 'rejected') stopCallCleanup();
            });
            onSnapshot(answerCandidates, snapshot => { snapshot.docChanges().forEach(change => { if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data())); }); });
        }

        document.getElementById('btn-start-voice-call').addEventListener('click', () => startCall('voice'));
        document.getElementById('btn-start-video-call').addEventListener('click', () => startCall('video'));

        function listenForIncomingCalls() {
            const qPrivate = query(collection(db, "calls"), where("calleeId", "==", currentUser.uid), where("status", "==", "calling"));
            onSnapshot(qPrivate, (snapshot) => { handleIncomingCallDocs(snapshot); });
            const qGroup = query(collection(db, "groups"), where("members", "array-contains", currentUser.uid));
            onSnapshot(qGroup, (groupSnap) => {
                groupSnap.forEach(gDoc => {
                    const qCallGrp = query(collection(db, "calls"), where("calleeId", "==", `GROUP_${gDoc.id}`), where("status", "==", "calling"));
                    onSnapshot(qCallGrp, (callSnap) => { handleIncomingCallDocs(callSnap); });
                });
            });
        }

        function handleIncomingCallDocs(snapshot) {
            snapshot.docChanges().forEach(async (change) => {
                if (change.type === "added") {
                    const callData = change.doc.data();
                    if(callData.callerId === currentUser.uid) return; 
                    currentCallDocId = change.doc.id;
                    currentCallMode = callData.callMode || 'voice';
                    
                    document.getElementById('incoming-caller-name').innerText = callData.type === 'group' ? `Grup (dari ${callData.callerName})` : callData.callerName;
                    document.getElementById('incoming-call-type').innerText = currentCallMode === 'video' ? "Memanggil Video..." : "Memanggil Suara...";
                    
                    // Ambil foto penelpon untuk UI
                    const callerDoc = await getDoc(doc(db, "users", callData.callerId));
                    if(callerDoc.exists() && callerDoc.data().photoURL) { document.getElementById('incoming-caller-avatar').src = callerDoc.data().photoURL; }

                    modalIncoming.style.display = 'flex';
                    playRingtone(); // Mainkan Nada Dering
                }
            });
        }

        document.getElementById('btn-answer-call').addEventListener('click', async () => {
            stopRingtone(); // Matikan nada dering
            modalIncoming.style.display = 'none'; modalActive.style.display = 'flex';
            document.getElementById('active-call-name').innerText = document.getElementById('incoming-caller-name').innerText;
            document.getElementById('active-call-status').innerText = "Menghubungkan...";

            if (currentCallMode === 'video') { localVideo.style.display = 'block'; remoteVideo.style.display = 'block'; document.getElementById('active-call-avatar').style.display = 'none'; } 
            else { localVideo.style.display = 'none'; remoteVideo.style.display = 'none'; document.getElementById('active-call-avatar').style.display = 'block'; document.getElementById('active-call-avatar').src = document.getElementById('incoming-caller-avatar').src; }

            pc = new RTCPeerConnection(servers);
            try {
                const constraints = currentCallMode === 'video' ? { audio: true, video: true } : { audio: true, video: false };
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                if (currentCallMode === 'video') localVideo.srcObject = localStream;
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            } catch (e) { alert("Gagal mengakses media!"); stopCallCleanup(); return; }

            pc.ontrack = event => { if (currentCallMode === 'video') remoteVideo.srcObject = event.streams[0]; else remoteAudio.srcObject = event.streams[0]; };

            const callDocRef = doc(db, "calls", currentCallDocId);
            const offerCandidates = collection(callDocRef, 'offerCandidates'); const answerCandidates = collection(callDocRef, 'answerCandidates');
            pc.onicecandidate = event => { if (event.candidate) addDoc(answerCandidates, event.candidate.toJSON()); };

            const callData = (await getDoc(callDocRef)).data();
            await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
            const answerDescription = await pc.createAnswer(); await pc.setLocalDescription(answerDescription);

            await updateDoc(callDocRef, { answer: { type: answerDescription.type, sdp: answerDescription.sdp }, status: 'answered' });
            document.getElementById('active-call-status').innerText = "Terhubung";

            onSnapshot(offerCandidates, snapshot => { snapshot.docChanges().forEach(change => { if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data())); }); });
            callSnapshotUnsub = onSnapshot(callDocRef, (docSnap) => { if (docSnap.data()?.status === 'ended') stopCallCleanup(); });
        });

        document.getElementById('btn-reject-call').addEventListener('click', async () => {
            stopRingtone(); modalIncoming.style.display = 'none';
            if (currentCallDocId) await updateDoc(doc(db, "calls", currentCallDocId), { status: 'rejected' });
        });

        document.getElementById('btn-end-call').addEventListener('click', async () => {
            if (currentCallDocId) await updateDoc(doc(db, "calls", currentCallDocId), { status: 'ended' });
            stopCallCleanup();
        });

        function stopCallCleanup() {
            stopRingtone();
            if (pc) { pc.close(); pc = null; }
            if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
            if (localVideo.srcObject) localVideo.srcObject = null;
            if (remoteVideo.srcObject) remoteVideo.srcObject = null;
            if (remoteAudio.srcObject) remoteAudio.srcObject = null;
            if (callSnapshotUnsub) { callSnapshotUnsub(); callSnapshotUnsub = null; }
            modalActive.style.display = 'none'; modalIncoming.style.display = 'none';
            currentCallDocId = null;
        }
    </script>
</body>
</html>
