<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gibah</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00a884">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Helvetica, sans-serif; background-color: #d1d7db; display: flex; height: 100vh; height: 100dvh; justify-content: center; align-items: center; overflow: hidden; position: relative;}

        /* --- NATIVE APP FEEL --- */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }

        /* Izinkan ketik di input */
        input, textarea {
            -webkit-user-select: auto;
            user-select: auto;
        }

        /* --- GAYA UNTUK CENTANG (TICKS) --- */
        .msg-status {
            font-size: 11px;
            margin-left: 4px;
            display: inline-block;
        }
        .tick-sent, .tick-delivered { color: #8696a0; }
        .tick-read { color: #53bdeb; }
        
        /* Banner In-App */
        .banner-container { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none;}
        .in-app-banner { background: #fff; border-left: 5px solid #00a884; box-shadow: 0 4px 15px rgba(0,0,0,0.2); padding: 12px 15px; border-radius: 8px; display: flex; align-items: center; gap: 12px; pointer-events: auto; animation: slideDown 0.3s ease forwards, fadeOut 0.5s ease 4s forwards; cursor: pointer;}
        .in-app-banner img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .in-app-banner .b-info { flex: 1; }
        .in-app-banner h4 { margin: 0 0 3px 0; font-size: 14px; color: #111b21; }
        .in-app-banner p { margin: 0; font-size: 12px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;}
        
        @keyframes slideDown { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-20px); } }

        /* Layar Login */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; background: #f0f2f5; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .login-logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 2px solid #00a884; }
        .btn-google { background: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 5px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; margin-top: 20px; width: 100%; transition: 0.2s; }
        .btn-google:hover { background: #3367d6; }
        .hidden { display: none !important; }

        /*tambah teman dan grup */
        .fab-container { position: absolute; right: 20px; bottom: 80px; display: inline-block; z-index: 100; }
        .dropdown-menu { display: none; position: absolute; right: 0; bottom: 50px; background-color: #fff; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 10; border-radius: 5px; width: 160px; overflow: hidden; }
        .dropdown-menu.show { display: block; }
        .dropdown-item { padding: 12px 16px; display: block; text-decoration: none; color: #333; font-size: 14px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; }
        .dropdown-item:hover { background-color: #f1f1f1; }
        
        /* Container Utama */
        .app-container { display: flex; width: 100%; max-width: 1400px; height: 100vh; height: 100dvh; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); margin: 0 auto; position: relative; overflow: hidden; }
        
        /* Sidebar & Header */
        .sidebar { flex: 0 0 30%; min-width: 320px; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; background: #fff; position: relative; height: 100%; overflow: hidden; }
        .header { height: 60px; background-color: #f0f2f5; display: flex; align-items: center; padding: 0 15px; font-weight: 600; color: #41525d; border-bottom: 1px solid #ddd; flex-shrink: 0; }
        .tab-content-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; height: calc(100% - 60px); position: relative; }
        .tab-pane { display: none; flex-direction: column; height: 100%; position: relative; }
        .tab-pane.active { display: flex; }

        .menu-box { padding: 15px; background: #fff; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
        .menu-row { display: flex; gap: 5px; }
        .menu-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 14px; }
        .menu-row button { padding: 10px 15px; background: #00a884; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        
        .list-container { flex: 1; overflow-y: auto; }
        .list-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #f2f2f2; cursor: pointer; position: relative;}
        .list-item:hover { background-color: #f5f6f6; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background-color: #dfe5e7; margin-right: 15px; flex-shrink: 0; object-fit: cover; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; font-size: 20px;}
        .info { flex: 1; overflow: hidden; }
        .name { font-weight: 500; font-size: 16px; margin: 0 0 3px 0; color: #111b21; }
        .preview { font-size: 13px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }
        .call-icon-indicator { font-size: 18px; color: #00a884; margin-left: auto; }
        
        .request-actions { display: flex; gap: 5px; }
        .btn-acc { background: #00a884; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .btn-rej { background: #d9534f; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }

        .tab-nav { display: flex; background: #f0f2f5; border-top: 1px solid #ddd; height: 60px; flex-shrink: 0; width: 100%; z-index: 5; }
        .tab-btn { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: none; border: none; cursor: pointer; color: #54656f; font-size: 12px; font-weight: 500; gap: 4px; transition: 0.2s; position: relative;}
        .tab-btn:hover { background: #e9edef; }
        .tab-btn.active { color: #00a884; font-weight: bold; }
        .badge { position: absolute; top: 5px; right: 15px; background: #d9534f; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold; display: none; }
        .icon svg { fill: currentColor; width: 22px; height: 22px; }

        .profile-container { padding: 20px; text-align: center; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #00a884; margin-bottom: 15px; cursor: pointer; }
        .profile-btn { background: #00a884; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        .logout-btn { background: #d9534f; margin-top: 20px; }

        .chat-main { flex: 1 1 auto; display: flex; flex-direction: column; background-color: #f0f2f5; width: 100%; height: 100%; overflow: hidden; position: relative;}
        #chat-empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; text-align: center; color: #667781; background-color: #f0f2f5; }
        #chat-empty-state h1 { font-weight: 300; margin-bottom: 10px; color: #41525d; }
        #chat-active-state { display: none; flex-direction: column; height: 100%; width: 100%; background-color: #efeae2; }
        .header-actions { margin-left: auto; display: flex; gap: 5px; align-items: center; }

        .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: contain; }
        .message { max-width: 65%; padding: 8px 12px; border-radius: 7px; font-size: 14px; position: relative; line-height: 1.4; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); word-wrap: break-word; }
        .message.received { background-color: #fff; align-self: flex-start; border-top-left-radius: 0; }
        .message.sent { background-color: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .msg-sender { font-size: 11px; font-weight: bold; color: #00766c; margin-bottom: 2px; }
        .msg-time-container { display: flex; align-items: center; justify-content: flex-end; margin: 4px 0 -4px 10px; float: right; gap: 4px; }
        .msg-time { font-size: 11px; color: #667781; }
        
        .chat-input-area { background-color: #f0f2f5; display: flex; align-items: center; padding: 10px 15px; gap: 10px; flex-shrink: 0; }
        .chat-input-area input[type="text"] { flex: 1; border: none; padding: 12px 15px; border-radius: 8px; outline: none; font-size: 15px; }
        .action-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #54656f; padding: 5px; border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .btn-send { background-color: #00a884; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* Modals */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; background: rgba(0,0,0,0.5); z-index: 2000; display: none; justify-content: center; align-items: center; }
        .modal-box { background: white; width: 90%; max-width: 350px; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; max-height: 80vh; }
        .modal-header { padding: 15px; background: #00a884; color: white; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .modal-close { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .modal-content { flex: 1; overflow-y: auto; padding: 10px 0; }

        .call-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh; background: rgba(0,0,0,0.9); z-index: 3000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        .call-avatar { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 20px; object-fit: cover; border: 3px solid #00a884; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(0, 168, 132, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0); } }
        .call-modal h2 { margin: 0 0 10px 0; font-size: 24px; font-weight: 500; }
        .call-actions { display: flex; gap: 30px; margin-top: 20px;}
        .btn-call { border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .btn-call:hover { transform: scale(1.1); }
        .btn-answer { background-color: #00a884; }
        .btn-reject { background-color: #d9534f; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; min-width: 100%; flex: 1; height: 100%; }
            .chat-main { position: absolute; top: 0; left: 100%; width: 100%; height: 100%; transition: left 0.3s ease; z-index: 10; }
            .chat-main.active-mobile { left: 0; }
            #btn-back-mobile { display: block !important; margin-right: 15px; font-size: 20px; background: none; border: none; cursor: pointer; color: #54656f; }
        }
        .badge-chat-count {
            background-color: #00a884;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            display: none;
            margin-left: auto;
        }
        #btn-back-mobile { display: none; }
        /* Container item chat agar mendukung swipe */
.chat-item-wrapper {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid #f2f2f2;
}

.chat-list-item {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    background-color: #fff;
    cursor: pointer;
    position: relative;
    z-index: 2;
    transition: transform 0.2s ease;
    width: 100%;
}

.chat-list-item:hover {
    background-color: #f5f6f6;
}

/* Tombol hapus di balik item chat saat diswipe */
.chat-delete-action {
    position: absolute;
    right: 0;
    top: 0;
    height: 100%;
    background-color: #d9534f;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 90px;
    font-weight: bold;
    font-size: 14px;
    z-index: 1;
    cursor: pointer;
}
    </style>
</head>
<body>
    
    <audio id="audio-notif" src="https://assets.mixkit.co/active_storage/sfx/2854/2854-preview.mp3" preload="auto"></audio>

    <div id="banner-container" class="banner-container"></div>

    <!-- Modals -->
    <div id="group-add-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header"><span>Tambah Kontak ke Grup</span><button class="modal-close" id="btn-close-group-modal">✖</button></div>
            <div class="modal-content" id="group-add-contact-list"></div>
        </div>
    </div>

    <!-- Modal Lihat Anggota & Hapus Grup -->
    <div id="group-members-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header"><span>Anggota Grup</span><button class="modal-close" id="btn-close-members-modal">✖</button></div>
            <div class="modal-content" id="group-members-list"></div>
            <div style="padding: 15px; background: #f0f2f5; border-top: 1px solid #ddd; text-align: center;" id="group-admin-actions">
                <button id="btn-delete-group" style="background: #d9534f; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%;">Hapus Grup Ini</button>
            </div>
        </div>
    </div>

    <!-- Layar Login -->
    <div id="login-screen">
        <div class="login-box">
            <img src="https://raw.githubusercontent.com/odinuios/Gombleh/refs/heads/main/icon.png" alt="Logo Gibah" class="login-logo">
            <h2>Gibah Dolo Yok</h2>
            <button id="btn-login" class="btn-google">Masuk dengan Google</button>
        </div>
    </div>

    <!-- Aplikasi Utama -->
    <div id="app-container" class="app-container hidden">
        <div class="sidebar">
            <div class="tab-content-area">
                <div id="tab-chats" class="tab-pane active">
                    <div class="header"><span style="font-size: 20px; font-weight: bold;">Chats</span></div>
                    <div class="list-container" id="chat-list-container"></div>
                </div>

                <div id="tab-contacts" class="tab-pane">
                    <div class="header"><span style="font-size: 20px; font-weight: bold;">Kontak</span></div>
                    
                    <div id="input-container-friend" class="menu-box hidden" style="background: #f9f9f9;">
                        <div class="menu-row">
                            <input type="email" id="add-email-input" placeholder="Email teman..." autocomplete="off">
                            <button id="btn-add-contact">Undang</button>
                        </div>
                    </div>

                    <div id="input-container-group" class="menu-box hidden" style="background: #f9f9f9;">
                        <div class="menu-row">
                            <input type="text" id="group-name-input" placeholder="Nama Grup..." autocomplete="off">
                            <button id="btn-create-group" style="background:#005c4b;">Buat</button>
                        </div>
                    </div>
                    
                    <div id="friend-requests-container" style="background: #f5f6f6;"></div>
                    <div class="list-container" id="contact-list-container"></div>

                    <div class="fab-container">
                        <button id="btn-main-plus" style="background: #00a884; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">+</button>
                        <div id="dropdown-action-menu" class="dropdown-menu">
                            <button class="dropdown-item" id="menu-add-friend">Tambah Teman</button>
                            <button class="dropdown-item" id="menu-add-group">Buat Grup</button>
                        </div>
                    </div>
                </div>

                <div id="tab-calls" class="tab-pane">
                    <div class="header"><span style="font-size: 20px; font-weight: bold;">Panggilan</span></div>
                    <div class="list-container" id="call-history-container">
                        <p style="text-align:center; color:#888; font-size:14px; margin-top:20px;" id="empty-calls">Tidak ada riwayat panggilan.</p>
                    </div>
                </div>

                <div id="tab-profile" class="tab-pane">
                    <div class="header"><span style="font-size: 20px; font-weight: bold;">Profil Anda</span></div>
                    <div class="profile-container">
                        <input type="file" id="profile-photo-input" style="display: none;" accept="image/*">
                        <img src="https://via.placeholder.com/120" id="profile-avatar-preview" class="profile-avatar" title="Klik ganti foto">
                        <p style="font-size: 12px; color: #667; margin-top: -5px;">(Klik foto untuk mengubah)</p>
                        <div class="menu-row" style="margin-top: 15px;"><input type="text" id="profile-name-input" placeholder="Nama Tampilan"></div>
                        <button id="btn-save-profile" class="profile-btn">Simpan Profil</button>
                        <button id="btn-logout" class="profile-btn logout-btn">Keluar (Logout)</button>
                    </div>
                </div>
            </div>

            <div class="tab-nav">
                <button class="tab-btn active" data-tab="tab-chats">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3C6.48 3 2 6.93 2 11.77c0 2.82 1.56 5.3 3.96 6.88L5 22l3.66-1.92c1.06.3 2.18.45 3.34.45 5.52 0 10-3.93 10-8.76S17.52 3 12 3z"/></svg></span>
                    <span>Chats</span>
                </button>
                <button class="tab-btn" data-tab="tab-contacts">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></span>
                    <span>Kontak</span>
                    <div class="badge" id="contact-badge">0</div>
                </button>
                <button class="tab-btn" data-tab="tab-calls">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.03 21c.76 0 .98-.66.98-1.21v-3.42c0-.54-.45-.99-.99-.99z"/></svg></span>
                    <span>Panggilan</span>
                </button>
                <button class="tab-btn" data-tab="tab-profile">
                    <span class="icon"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.73 8.85a.49.49 0 0 0 .12.61l2.03 1.58c-.04.3-.06.62-.06.94 0 .32.02.64.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></span>
                    <span>Profil</span>
                </button>
            </div>
        </div>

        <div class="chat-main" id="chat-main-area">
            <div id="chat-empty-state">
                <span style="font-size: 80px; color:#d1d7db; margin-bottom: 20px;">💬</span>
                <h1>Mau gibah ama sapa nih?</h1>
                <p>Kirim pesan dan lakukan panggilan.</p>
            </div>

            <div id="chat-active-state">
                <div class="header">
                    <button id="btn-back-mobile">←</button>
                    <div id="chat-main-header" style="display: flex; align-items: center; gap: 10px; cursor: pointer;"></div>
                    <div class="header-actions" id="chat-header-actions" style="display: flex; gap: 5px;">
                        <button class="action-btn" id="btn-open-group-modal" title="Tambah Anggota" style="display:none;">➕</button>
                        <button class="action-btn" id="btn-open-members-modal" title="Lihat Anggota" style="display:none;">👥</button>
                        <button class="action-btn" id="btn-start-voice-call" title="Panggilan Suara">📞</button>
                        <button class="action-btn" id="btn-start-video-call" title="Video Call">📹</button>
                    </div>
                </div>
                
                <div class="chat-history"></div>
                
                <!-- PERBAIKAN FITUR LAMPIRAN -->
                <div class="chat-input-area" style="position: relative;">
                    <!-- Menu Dropdown Lampiran -->
                    <div id="attach-menu" class="dropdown-menu" style="bottom: 50px; left: 15px; width: 160px; z-index: 10;">
                        <button class="dropdown-item" id="attach-photo">🖼️ Foto</button>

    <!-- Modals Panggilan Masuk -->
    <div id="incoming-call-modal" class="call-modal">
        <img src="https://via.placeholder.com/100" id="incoming-caller-avatar" class="call-avatar">

    <!-- Modal Panggilan Aktif -->
    <div id="active-call-modal" class="call-modal">
        <video id="remote-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; background: #111;"></video>
        <video id="local-video" autoplay playsinline muted style="width: 100px; height: 140px; object-fit: cover; position: absolute; top: 20px; right: 20px; border-radius: 10px; border: 2px solid white; z-index: 2; background: #000; display:none;"></video>
        <audio id="remote-audio" autoplay></audio>
        
        <div style="z-index: 3; position: relative; margin-top: auto; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; width: 100%;">
            <img src="https://via.placeholder.com/100" id="active-call-avatar" class="call-avatar" style="display:none; animation:none;">
            <h2 id="active-call-name" style="margin-bottom: 5px;">Nama</h2>
            <p id="active-call-status" style="margin-bottom: 15px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px;">Memanggil...</p>
            <div class="call-actions">
                <button class="btn-call btn-reject" id="btn-end-call" title="Akhiri">☎</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc, updateDoc, where, getDocs, getDoc, deleteDoc, arrayUnion, arrayRemove, limit, or } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCx4_E64FBUDyo4RzDDWMLklRlZMvMUlFM",
            authDomain: "gombleh-9dea6.firebaseapp.com",
            projectId: "gombleh-9dea6",
            storageBucket: "gombleh-9dea6.firebasestorage.app",
            messagingSenderId: "1034286098492",
            appId: "1:1034286098492:web:87c81098f5ad465e187b39"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let activeTargetId = null; 
        let activeTargetName = null;
        let activeTargetType = 'private'; 
        let unsubscribeChat = null;
        let currentCallMode = 'voice';
        let processedMessages = new Set();

        const audioNotif = document.getElementById('audio-notif');

        function playNotif() { audioNotif.currentTime = 0; audioNotif.play().catch(e => {}); }

        // ================= PENGELOLA DERING PANGGILAN =================
        let ringtoneAudio = null;

        function playRingtone() {
            try {
                if (!ringtoneAudio) {
                    ringtoneAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                    ringtoneAudio.loop = true;
                }
                ringtoneAudio.play().catch(e => console.log("Audio autoplay diblokir browser:", e));
            } catch (err) {
                console.error("Gagal memutar dering:", err);
            }
        }

        function stopRingtone() {
            if (ringtoneAudio) {
                ringtoneAudio.pause();
                ringtoneAudio.currentTime = 0;
            }
        }

        const bannerContainer = document.getElementById('banner-container');
        function showNotification(title, body, photo = 'https://via.placeholder.com/40') {
            playNotif();
            if (Notification.permission === 'granted' && document.hidden) {
                new Notification(title, { body: body, icon: photo });
            }
            const banner = document.createElement('div');
            banner.className = 'in-app-banner';
            banner.innerHTML = `<img src="${photo}"><div class="b-info"><h4>${title}</h4><p>${body}</p></div>`;
            banner.addEventListener('click', () => banner.remove());
            bannerContainer.appendChild(banner);
            setTimeout(() => { if(bannerContainer.contains(banner)) banner.remove(); }, 4500);
        }

        // ================= LISTENER PANGGILAN MASUK =================
        function listenForIncomingCalls() {
    if (!currentUser) return;

    onSnapshot(query(collection(db, "calls"), where("calleeId", "==", currentUser.uid), where("status", "==", "calling")), (snapshot) => {
        snapshot.docChanges().forEach(async (change) => {
            if (change.type === "added") {
                const callData = change.doc.data();
                if (callData.callerId === currentUser.uid) return; 
                
                currentCallDocId = change.doc.id;
                currentCallMode = callData.callMode || 'voice';
                
                document.getElementById('incoming-caller-name').innerText = callData.callerName;
                document.getElementById('incoming-call-type').innerText = currentCallMode === 'video' ? "Panggilan Video Masuk..." : "Panggilan Suara Masuk...";
                document.getElementById('incoming-call-modal').style.display = 'flex';
                
                playRingtone();
                showNotification("Panggilan Masuk", `${callData.callerName} memanggil Anda...`, 'https://raw.githubusercontent.com/odinuios/Gombleh/refs/heads/main/icon.png');
                
                // Listener untuk memantau jika penelepon menutup/membatalkan panggilan
                const unsubWatch = onSnapshot(doc(db, "calls", currentCallDocId), async (ds) => {
                            if (!ds.exists()) return;
                            const status = ds.data().status;
                            
                            // Jika status berubah jadi rejected/ended tanpa sempat di-answer, catat missed call
                            if (status !== 'calling' && status !== 'answered') {
                                stopRingtone(); 
                                document.getElementById('incoming-call-modal').style.display = 'none'; 
                                unsubWatch();
                    }
                });
            }
        });
    });
}
        
        // ================= PENANGANAN LAMPIRAN (FOTO, KAMERA, FILE, LOKASI) =================
        const btnAttach = document.getElementById('btn-attach');
        const attachMenu = document.getElementById('attach-menu');
        const inputPhoto = document.getElementById('input-photo');
        const inputCamera = document.getElementById('input-camera');
        const inputFile = document.getElementById('input-file');

        btnAttach.addEventListener('click', (e) => {
            e.stopPropagation();
            attachMenu.classList.toggle('show');
        });

        window.addEventListener('click', () => {
            if (attachMenu && attachMenu.classList.contains('show')) attachMenu.classList.remove('show');
        });

        document.getElementById('attach-photo').addEventListener('click', () => inputPhoto.click());
        document.getElementById('attach-camera').addEventListener('click', () => inputCamera.click());
        document.getElementById('attach-file').addEventListener('click', () => inputFile.click());

        async function handleAttachment(e) {
            const file = e.target.files[0];
            if (!file || !activeTargetId) return;

            const inputId = e.target.id;
            const isImage = (inputId === 'input-photo' || inputId === 'input-camera');
            const msgType = isImage ? 'image' : 'file';
            const chatId = activeTargetType === 'group' ? activeTargetId : (currentUser.uid < activeTargetId ? `${currentUser.uid}_${activeTargetId}` : `${activeTargetId}_${currentUser.uid}`);
            
            const originalBtnText = btnAttach.innerText;
            btnAttach.innerText = "⏳";
            btnAttach.disabled = true;

            try {
                const safeFileName = file.name || (isImage ? "foto.jpg" : "file_lampiran");

                const CLOUD_NAME = "jgcuvsst"; 
                const UPLOAD_PRESET = "gombleh"; 

                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", UPLOAD_PRESET);

                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                if (!data.secure_url) {
                    throw new Error("Gagal mengunggah ke Cloudinary");
                }

                const fileUrl = data.secure_url;

                await addDoc(collection(db, "chats", chatId, "messages"), {
                    senderId: currentUser.uid,
                    senderName: currentUser.displayName,
                    text: isImage ? '📷 Foto' : `📄 ${safeFileName}`,
                    fileUrl: fileUrl,
                    fileName: safeFileName,
                    type: msgType,
                    status: 'sent',
                    timestamp: serverTimestamp()
                });
            } catch (error) {
                console.error("Gagal mengirim lampiran:", error);
                alert("Gagal mengunggah file ke Cloudinary. Periksa Cloud Name dan Upload Preset Anda.");
            } finally {
                btnAttach.innerText = "📎";
                btnAttach.disabled = false;
                e.target.value = '';
            }
        }

        inputPhoto.addEventListener('change', handleAttachment);
        inputCamera.addEventListener('change', handleAttachment);
        inputFile.addEventListener('change', handleAttachment);

        document.getElementById('attach-location').addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert("Geolokasi tidak didukung di browser Anda.");
                return;
            }
            navigator.geolocation.getCurrentPosition(async (position) => {
                if (!activeTargetId) return;
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const locationLink = `https://www.google.com/maps?q=${lat},${lon}`;
                const chatId = activeTargetType === 'group' ? activeTargetId : (currentUser.uid < activeTargetId ? `${currentUser.uid}_${activeTargetId}` : `${activeTargetId}_${currentUser.uid}`);
                
                await addDoc(collection(db, "chats", chatId, "messages"), {
                    senderId: currentUser.uid,
                    senderName: currentUser.displayName,
                    text: locationLink,
                    type: 'location',
                    status: 'sent',
                    timestamp: serverTimestamp()
                });
            }, () => {
                alert("Gagal mengambil lokasi. Pastikan izin lokasi diberikan.");
            });
        });

        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const chatListContainer = document.getElementById('chat-list-container');
        const contactListContainer = document.getElementById('contact-list-container');
        const callHistoryContainer = document.getElementById('call-history-container');
        const friendRequestsContainer = document.getElementById('friend-requests-container');
        const emptyCalls = document.getElementById('empty-calls');
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-tab')).classList.add('active');
            });
        });

        document.getElementById('btn-back-mobile').addEventListener('click', () => {
            document.getElementById('chat-main-area').classList.remove('active-mobile');
            activeTargetId = null;
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            setPersistence(auth, browserLocalPersistence).then(() => signInWithPopup(auth, provider)).catch(error => alert(error.message));
        });
        document.getElementById('btn-logout').addEventListener('click', () => { signOut(auth).then(() => location.reload()); });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');
                document.getElementById('profile-avatar-preview').src = user.photoURL || 'https://via.placeholder.com/120';
                document.getElementById('profile-name-input').value = user.displayName || '';
                
                await setDoc(doc(db, "users", user.uid), { uid: user.uid, name: user.displayName, email: user.email, photoURL: user.photoURL }, { merge: true });
                
                requestNotificationPermission();
                loadSidebarItems();
                listenForIncomingCalls(); 
                listenForFriendRequests();
                listenForCallHistory();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        });

        async function requestNotificationPermission() {
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    const messaging = getMessaging(app);
                    const token = await getToken(messaging, { 
                        vapidKey: "BK1FltIiH95S8vYRIYSdAsXu-PCDq6V2BmH0nHr6rOzU_AyJT_mXA3ToyVjylQ-y40aoouSxAfNxiiZJYOaEr-o" 
                    });
                    if (token) {
                        await setDoc(doc(db, "users", currentUser.uid), { fcmToken: token }, { merge: true });
                    }
                }
            } catch(e) {
                console.error("Gagal mendapatkan token notifikasi:", e);
            }
        }

        // ================= PERMINTAAN PERTEMANAN =================
        document.getElementById('btn-add-contact').addEventListener('click', async () => {
            const email = document.getElementById('add-email-input').value.trim().toLowerCase();
            if (!email || email === currentUser.email) return;
            const q = query(collection(db, "users"), where("email", "==", email));
            const snapshot = await getDocs(q);
            if (snapshot.empty) return alert("Email belum terdaftar.");
            let targetUser; snapshot.forEach(doc => targetUser = doc.data());
            
            await setDoc(doc(db, "users", targetUser.uid, "friend_requests", currentUser.uid), {
                uid: currentUser.uid, name: currentUser.displayName, email: currentUser.email, photoURL: currentUser.photoURL, timestamp: serverTimestamp()
            });
            document.getElementById('add-email-input').value = '';
            alert("Permintaan pertemanan terkirim!");
        });

        function listenForFriendRequests() {
            onSnapshot(collection(db, "users", currentUser.uid, "friend_requests"), (snapshot) => {
                friendRequestsContainer.innerHTML = '';
                const contactBadge = document.getElementById('contact-badge');
                if (snapshot.empty) { contactBadge.style.display = 'none'; } 
                else {
                    contactBadge.style.display = 'block'; contactBadge.innerText = snapshot.size;
                    snapshot.forEach((docSnap) => {
                        const reqData = docSnap.data();
                        const div = document.createElement('div');
                        div.className = 'list-item req-item';
                        div.innerHTML = `<img src="${reqData.photoURL || 'https://via.placeholder.com/45'}" class="avatar"><div class="info"><p class="name">${reqData.name}</p><p class="preview">Minta ditambahkan</p></div><div class="request-actions"><button class="btn-acc" data-uid="${reqData.uid}">Terima</button><button class="btn-rej" data-uid="${reqData.uid}">Tolak</button></div>`;
                        div.querySelector('.btn-acc').addEventListener('click', async () => {
                            await setDoc(doc(db, "users", currentUser.uid, "contacts", reqData.uid), { uid: reqData.uid, type: 'private' });
                            await setDoc(doc(db, "users", reqData.uid, "contacts", currentUser.uid), { uid: currentUser.uid, type: 'private' });
                            await deleteDoc(doc(db, "users", currentUser.uid, "friend_requests", reqData.uid));
                        });
                        div.querySelector('.btn-rej').addEventListener('click', () => deleteDoc(doc(db, "users", currentUser.uid, "friend_requests", reqData.uid)));
                        friendRequestsContainer.appendChild(div);
                    });
                }
            });
        }

        // ================= FITUR MEMBUAT GRUP =================
        document.getElementById('btn-create-group').addEventListener('click', async () => {
            const groupName = document.getElementById('group-name-input').value.trim();
            if (!groupName) return alert("Nama grup tidak boleh kosong!");
            
            const groupRef = doc(collection(db, "groups"));
            const groupId = groupRef.id;
            
            const groupData = {
                uid: groupId,
                name: groupName,
                type: 'group',
                members: [currentUser.uid],
                admins: [currentUser.uid],
                createdAt: serverTimestamp()
            };
            
            await setDoc(groupRef, groupData);
            await setDoc(doc(db, "users", currentUser.uid, "contacts", groupId), {
                uid: groupId,
                type: 'group',
                name: groupName
            });
            
            document.getElementById('group-name-input').value = '';
            alert("Grup berhasil dibuat!");
        });

// ================= LOAD SIDEBAR & CHAT =================
        function loadSidebarItems() {
            chatListContainer.innerHTML = ''; contactListContainer.innerHTML = '';
            
            onSnapshot(collection(db, "users", currentUser.uid, "contacts"), (snapshot) => {
                document.querySelectorAll('.item-private, .item-group').forEach(el => el.remove());
                
                snapshot.forEach((docSnap) => {
                    const contactData = docSnap.data();
                    
                    if (contactData.type === 'group') {
                        onSnapshot(doc(db, "groups", contactData.uid), (groupDoc) => {
                            if (!groupDoc.exists()) {
                                document.getElementById(`chat-item-${contactData.uid}`)?.remove();
                                document.getElementById(`contact-item-${contactData.uid}`)?.remove();
                                return;
                            }
                            const latestData = groupDoc.data();
                            const chatId = latestData.uid;
                            
                            setupChatNotificationListener(chatId, latestData.name, 'https://via.placeholder.com/45', 'group');

                            document.getElementById(`chat-item-${contactData.uid}`)?.remove();
                            document.getElementById(`contact-item-${contactData.uid}`)?.remove();

                            // Listener unread count grup yang lebih aman
                            onSnapshot(collection(db, "chats", chatId, "messages"), (msgSnap) => {
                                let unreadCount = 0;
                                msgSnap.forEach(mDoc => {
                                    const mData = mDoc.data();
                                    if (mData.senderId !== currentUser.uid && mData.status !== 'read') {
                                        unreadCount++;
                                    }
                                });
                                const badgeEl = document.getElementById(`unread-badge-${contactData.uid}`);
                                if (badgeEl) {
                                    if (unreadCount > 0) {
                                        badgeEl.style.display = 'inline-block';
                                        badgeEl.innerText = unreadCount;
                                    } else {
                                        badgeEl.style.display = 'none';
                                    }
                                }
                            });

                            // Helper untuk membuat item Kontak (tanpa swipe)
                            const makeContactItem = (idPrefix) => {
                                const d = document.createElement('div');
                                d.className = 'list-item item-group'; d.id = `${idPrefix}-${contactData.uid}`;
                                d.innerHTML = `<div class="avatar" style="background:#00a884; color:white; font-size: 20px;">👥</div><div class="info"><p class="name">${latestData.name}</p><p class="preview">Grup Chat</p></div>`;
                                d.addEventListener('click', () => openChat(latestData.uid, latestData.name, null, 'group'));
                                return d;
                            };

                            // Helper untuk membuat item Chat (dengan fitur Swipe Hapus & Badge Unread)
                            const makeChatItem = (idPrefix) => {
                                const wrapper = document.createElement('div');
                                wrapper.className = 'chat-item-wrapper item-group'; 
                                wrapper.id = `${idPrefix}-${contactData.uid}`;

                                const deleteBtn = document.createElement('div');
                                deleteBtn.className = 'chat-delete-action';
                                deleteBtn.innerHTML = 'Hapus Chat';
                                
                                deleteBtn.addEventListener('click', async (e) => {
                                    e.stopPropagation();
                                    if (confirm(`Hapus semua riwayat chat grup ${latestData.name}?`)) {
                                        const msgSnap = await getDocs(collection(db, "chats", chatId, "messages"));
                                        const batchDeletes = msgSnap.docs.map(d => deleteDoc(d.ref));
                                        await Promise.all(batchDeletes);
                                        wrapper.remove();
                                        if (activeTargetId === contactData.uid) {
                                            document.getElementById('chat-active-state').style.display = 'none';
                                            document.getElementById('chat-empty-state').style.display = 'flex';
                                            activeTargetId = null;
                                        }
                                    }
                                });

                                const d = document.createElement('div');
                                d.className = 'list-item chat-list-item';
                                d.innerHTML = `
                                    <div class="avatar" style="background:#00a884; color:white; font-size: 20px;">👥</div>
                                    <div class="info">
                                        <p class="name">${latestData.name}</p>
                                        <p class="preview">Grup Chat</p>
                                    </div>
                                    <span class="badge-chat-count" id="unread-badge-${contactData.uid}" style="background:#00a884; color:white; border-radius:50%; padding:2px 6px; font-size:11px; font-weight:bold; display:none; margin-left:auto;">0</span>
                                `;

                                let startX = 0, currentX = 0, isSwiping = false;
                                d.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; isSwiping = true; });
                                d.addEventListener('touchmove', (e) => {
                                    if (!isSwiping) return;
                                    currentX = e.touches[0].clientX;
                                    let diff = currentX - startX;
                                    if (diff < 0 && diff > -100) d.style.transform = `translateX(${diff}px)`;
                                });
                                d.addEventListener('touchend', () => {
                                    isSwiping = false;
                                    let diff = currentX - startX;
                                    d.style.transform = (diff < -50) ? `translateX(-90px)` : `translateX(0px)`;
                                    startX = 0; currentX = 0;
                                });

                                d.addEventListener('click', () => {
                                    d.style.transform = `translateX(0px)`;
                                    openChat(latestData.uid, latestData.name, null, 'group');
                                });

                                wrapper.appendChild(deleteBtn);
                                wrapper.appendChild(d);
                                return wrapper;
                            };

                            contactListContainer.appendChild(makeContactItem('contact-item'));
                            chatListContainer.appendChild(makeChatItem('chat-item'));
                        });
                    } else {
                        onSnapshot(doc(db, "users", contactData.uid), (userDoc) => {
                            if (!userDoc.exists()) return;
                            const latestData = userDoc.data();
                            const chatId = currentUser.uid < latestData.uid ? `${currentUser.uid}_${latestData.uid}` : `${latestData.uid}_${currentUser.uid}`;
                            
                            setupChatNotificationListener(chatId, latestData.name, latestData.photoURL, 'private');

                            document.getElementById(`chat-item-${contactData.uid}`)?.remove();
                            document.getElementById(`contact-item-${contactData.uid}`)?.remove();

                            // Listener unread count privat yang lebih aman
                            onSnapshot(collection(db, "chats", chatId, "messages"), (msgSnap) => {
                                let unreadCount = 0;
                                msgSnap.forEach(mDoc => {
                                    const mData = mDoc.data();
                                    if (mData.senderId === latestData.uid && mData.status !== 'read') {
                                        unreadCount++;
                                    }
                                });
                                const badgeEl = document.getElementById(`unread-badge-${contactData.uid}`);
                                if (badgeEl) {
                                    if (unreadCount > 0) {
                                        badgeEl.style.display = 'inline-block';
                                        badgeEl.innerText = unreadCount;
                                    } else {
                                        badgeEl.style.display = 'none';
                                    }
                                }
                            });

                            // Helper untuk membuat item Kontak (tanpa swipe)
                            const makeContactItem = (idPrefix) => {
                                const d = document.createElement('div');
                                d.className = 'list-item item-private'; d.id = `${idPrefix}-${contactData.uid}`;
                                d.innerHTML = `
                                    <img src="${latestData.photoURL || 'https://via.placeholder.com/45'}" class="avatar">
                                    <div class="info">
                                        <p class="name">${latestData.name || 'User'}</p>
                                        <p class="preview">${latestData.email || ''}</p>
                                    </div>
                                `;

        let chatSwipeStartX = 0;
        let chatSwipeCurrentX = 0;
        const chatMainArea = document.getElementById('chat-main-area');

        chatMainArea.addEventListener('touchstart', (e) => {
            // Perbolehkan swipe jika dimulai dari setengah sisi kiri layar (< 150px dari kiri)
            if (e.touches[0].clientX < 150 && window.innerWidth <= 768) {
                chatSwipeStartX = e.touches[0].clientX;
                chatMainArea.style.transition = 'none'; // Matikan transisi saat jari bergerak
            } else {
                chatSwipeStartX = 0;
            }
        });

        chatMainArea.addEventListener('touchmove', (e) => {
            if (chatSwipeStartX === 0) return;
            chatSwipeCurrentX = e.touches[0].clientX;
            let diff = chatSwipeCurrentX - chatSwipeStartX;
            // Hanya izinkan geser ke kanan (positif)
            if (diff > 0) {
                chatMainArea.style.left = `${diff}px`;
            }
        });

        chatMainArea.addEventListener('touchend', () => {
            if (chatSwipeStartX === 0) return;
            let diff = chatSwipeCurrentX - chatSwipeStartX;
            
            // Kembalikan transisi CSS semula
            chatMainArea.style.transition = 'left 0.3s ease';

            // Jika digeser ke kanan lebih dari 70px, tutup chat
            if (diff > 70) {
                chatMainArea.classList.remove('active-mobile');
                chatMainArea.style.left = ''; // Reset inline style
                activeTargetId = null;
            } else {
                // Jika kurang dari 70px, pantulkan kembali ke posisi semula
                chatMainArea.style.left = '0';
            }
            
            chatSwipeStartX = 0;
            chatSwipeCurrentX = 0;
        });

        function listenForCallHistory() {

            onSnapshot(q, (snapshot) => {

                else {
                    emptyCalls.style.display = 'none';
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        const isOutgoing = data.callerId === currentUser.uid;
                        const targetId = isOutgoing ? data.calleeId : data.callerId;
                        const targetName = isOutgoing ? (data.calleeName || 'Seseorang') : data.callerName;
                        const isMissed = !isOutgoing && data.status !== 'answered' && data.status !== 'calling';
                        const timeStr = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';

                        const div = document.createElement('div');

                        `;

                        div.addEventListener('click', () => {

        // ================= WEBRTC PANGGILAN =================
        const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };
        let pc = null; let localStream = null; let currentCallDocId = null; let callSnapshotUnsub = null;
        
        async function startCall(mode) {
            currentCallMode = mode; document.getElementById('active-call-modal').style.display = 'flex';
            document.getElementById('active-call-name').innerText = activeTargetName;
            document.getElementById('active-call-status').innerText = "Memanggil...";

            if (mode === 'video') { document.getElementById('local-video').style.display = 'block'; document.getElementById('remote-video').style.display = 'block'; document.getElementById('active-call-avatar').style.display = 'none'; } 
            else { document.getElementById('local-video').style.display = 'none'; document.getElementById('remote-video').style.display = 'none'; document.getElementById('active-call-avatar').style.display = 'block'; }

            pc = new RTCPeerConnection(servers);
            try {
                localStream = await navigator.mediaDevices.getUserMedia(mode === 'video' ? { audio: true, video: true } : { audio: true, video: false });
                if (mode === 'video') document.getElementById('local-video').srcObject = localStream;
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            } catch (e) { alert("Akses media gagal."); stopCallCleanup(); return; }

            pc.ontrack = event => { if (mode === 'video') document.getElementById('remote-video').srcObject = event.streams[0]; else document.getElementById('remote-audio').srcObject = event.streams[0]; };

            const callDocRef = doc(collection(db, "calls")); currentCallDocId = callDocRef.id;
            const offerCandidates = collection(callDocRef, 'offerCandidates'); const answerCandidates = collection(callDocRef, 'answerCandidates');
            pc.onicecandidate = event => { if (event.candidate) addDoc(offerCandidates, event.candidate.toJSON()); };
            
            const offerDescription = await pc.createOffer(); await pc.setLocalDescription(offerDescription);
            
            await setDoc(callDocRef, { callerId: currentUser.uid, callerName: currentUser.displayName, calleeId: activeTargetType === 'group' ? `GROUP_${activeTargetId}` : activeTargetId, calleeName: activeTargetName, callMode: mode, type: activeTargetType, offer: { type: offerDescription.type, sdp: offerDescription.sdp }, status: 'calling', timestamp: serverTimestamp() });

            callSnapshotUnsub = onSnapshot(callDocRef, (docSnap) => {
                const data = docSnap.data();
                if (!data || data.status === 'ended' || data.status === 'rejected') { stopCallCleanup(); return; }
                if (data?.answer && !pc.currentRemoteDescription) pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                if (data?.status === 'answered') document.getElementById('active-call-status').innerText = "Terhubung";
            });
            onSnapshot(answerCandidates, snapshot => { snapshot.docChanges().forEach(change => { if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data())); }); });
        }

        document.getElementById('btn-start-voice-call').addEventListener('click', () => startCall('voice'));
        document.getElementById('btn-start-video-call').addEventListener('click', () => startCall('video'));

        // ================= PENERIMA PANGGILAN (CALLEE) =================
        async function acceptIncomingCall() {
            document.getElementById('active-call-modal').style.display = 'flex';
            document.getElementById('active-call-status').innerText = "Menghubungkan...";

            if (currentCallMode === 'video') { 
                document.getElementById('local-video').style.display = 'block'; 
                document.getElementById('remote-video').style.display = 'block'; 
                document.getElementById('active-call-avatar').style.display = 'none'; 
            } else { 
                document.getElementById('local-video').style.display = 'none'; 
                document.getElementById('remote-video').style.display = 'none'; 
                document.getElementById('active-call-avatar').style.display = 'block'; 
            }

            pc = new RTCPeerConnection(servers);
            try {
                localStream = await navigator.mediaDevices.getUserMedia(currentCallMode === 'video' ? { audio: true, video: true } : { audio: true, video: false });
                if (currentCallMode === 'video') document.getElementById('local-video').srcObject = localStream;
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            } catch (e) {
                alert("Akses media kamera/mikrofon ditolak.");
                stopCallCleanup();
                return;
            }

            pc.ontrack = event => { 
                if (currentCallMode === 'video') document.getElementById('remote-video').srcObject = event.streams[0]; 
                else document.getElementById('remote-audio').srcObject = event.streams[0]; 
            };

            const callDocRef = doc(db, "calls", currentCallDocId);
            const offerCandidates = collection(callDocRef, 'offerCandidates'); 
            const answerCandidates = collection(callDocRef, 'answerCandidates');

            pc.onicecandidate = event => { if (event.candidate) addDoc(answerCandidates, event.candidate.toJSON()); };

            const callDocSnap = await getDoc(callDocRef);
            const callData = callDocSnap.data();
            if (!callData) return;

            await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
            const answerDescription = await pc.createAnswer();
            await pc.setLocalDescription(answerDescription);

            await updateDoc(callDocRef, { answer: { type: answerDescription.type, sdp: answerDescription.sdp } });

            onSnapshot(offerCandidates, snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                });
            });

            callSnapshotUnsub = onSnapshot(callDocRef, (docSnap) => {
                const data = docSnap.data();
                if (!data || data.status === 'ended' || data.status === 'rejected') { 
                    stopCallCleanup(); 
                }
            });
        }
        async function logMissedCallToChat(callerId, calleeId, callMode) {
        const chatId = callerId < calleeId ? `${callerId}_${calleeId}` : `${calleeId}_${callerId}`;
        const callTypeText = callMode === 'video' ? '📹 Panggilan Video Tidak Terjawab' : '📞 Panggilan Suara Tidak Terjawab';
    
        try {
        await addDoc(collection(db, "chats", chatId, "messages"), {
            senderId: callerId,
            senderName: "Sistem Panggilan",
            text: callTypeText,
            type: 'missed_call',
            status: 'sent',
            timestamp: serverTimestamp()
        });
        } catch (e) {
        console.error("Gagal mencatat missed call ke chat:", e);
    }
}
        // ================= TOMBOL AKSI PANGGILAN MASUK & KELUAR =================
        document.getElementById('btn-answer-call').addEventListener('click', async () => { 
            stopRingtone();
            document.getElementById('incoming-call-modal').style.display = 'none';

            if (!currentCallDocId) return;
            await updateDoc(doc(db, "calls", currentCallDocId), { status: 'answered' });
            acceptIncomingCall();
        });
        
        document.getElementById('btn-reject-call').addEventListener('click', async () => { 
            stopRingtone(); 
            document.getElementById('incoming-call-modal').style.display = 'none';
            
            if (currentCallDocId) {
                const callDoc = await getDoc(doc(db, "calls", currentCallDocId));
                if (callDoc.exists()) {
                    const cData = callDoc.data();
                    // Catat missed call ke chat
                    await logMissedCallToChat(cData.callerId, cData.calleeId, cData.callMode);
                }
                await updateDoc(doc(db, "calls", currentCallDocId), { status: 'rejected' });
            }
        });
        
        document.getElementById('btn-end-call').addEventListener('click', async () => { 
            if (currentCallDocId) {
                try {
                    const callDoc = await getDoc(doc(db, "calls", currentCallDocId));
                    if (callDoc.exists()) {
                        const cData = callDoc.data();
                        // Jika dimatikan pemanggil sebelum sempat di-answer, catat missed call
                        if (cData.status === 'calling') {
                            await logMissedCallToChat(cData.callerId, cData.calleeId, cData.callMode);
                        }
                    }
                    await updateDoc(doc(db, "calls", currentCallDocId), { status: 'ended' });
                } catch (e) {
                    console.error("Gagal mengupdate status call:", e);
                }
            }
            stopRingtone(); 
            stopCallCleanup(); 
        });

        function stopCallCleanup() { 
            document.getElementById('active-call-modal').style.display = 'none';
            if (pc) { pc.close(); pc = null; }
            if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
            if (callSnapshotUnsub) { callSnapshotUnsub(); callSnapshotUnsub = null; }
        }

        const mainPlusBtn = document.getElementById('btn-main-plus');
        const actionMenu = document.getElementById('dropdown-action-menu');
        const friendInputBox = document.getElementById('input-container-friend');
        const groupInputBox = document.getElementById('input-container-group');

        mainPlusBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            actionMenu.classList.toggle('show');
        });

        window.addEventListener('click', () => {
            actionMenu.classList.remove('show');
        });

        document.getElementById('menu-add-friend').addEventListener('click', () => {
            friendInputBox.classList.toggle('hidden');
            groupInputBox.classList.add('hidden');
        });

        document.getElementById('menu-add-group').addEventListener('click', () => {
            groupInputBox.classList.toggle('hidden');
            friendInputBox.classList.add('hidden');
        });
        
        const storage = getStorage(app);

        // ================= LOGIKA GANTI FOTO & SIMPAN PROFIL (MENGGUNAKAN CLOUDINARY) =================
        const photoInput = document.getElementById('profile-photo-input');
        const avatarPreview = document.getElementById('profile-avatar-preview');
        let selectedProfileFile = null;

        avatarPreview.addEventListener('click', () => photoInput.click());

        photoInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                selectedProfileFile = e.target.files[0];
                avatarPreview.src = URL.createObjectURL(selectedProfileFile);
            }
        });

        document.getElementById('btn-save-profile').addEventListener('click', async () => {
            const newName = document.getElementById('profile-name-input').value.trim();
            if (!newName) return alert("Nama tidak boleh kosong.");
            
            const btn = document.getElementById('btn-save-profile');
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            try {
                let newPhotoUrl = currentUser.photoURL || null; 
                
                if (selectedProfileFile) {
                    const CLOUD_NAME = "jgcuvsst"; 
                    const UPLOAD_PRESET = "gombleh"; 

                    const formData = new FormData();
                    formData.append("file", selectedProfileFile);
                    formData.append("upload_preset", UPLOAD_PRESET);

                    const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/upload`, {
                        method: "POST",
                        body: formData
                    });

                    const data = await response.json();
                    if (!data.secure_url) {
                        throw new Error("Gagal mengunggah foto profil ke Cloudinary");
                    }

                    newPhotoUrl = data.secure_url;
                }

                await updateProfile(currentUser, { displayName: newName, photoURL: newPhotoUrl });
                
                const userDocData = { name: newName };
                if (newPhotoUrl) {
                    userDocData.photoURL = newPhotoUrl;
                }
                
                await setDoc(doc(db, "users", currentUser.uid), userDocData, { merge: true });
                
                alert("Profil berhasil diperbarui!");
            } catch (error) {
                console.error("Gagal update profil:", error);
                alert("Gagal menyimpan profil: " + error.message);
            } finally {
                btn.innerText = "Simpan Profil";
                btn.disabled = false;
            }
        });

        // --- SCRIPT PEMBASMI BANNER VERCEL ---
        setInterval(() => {
            const vercelElements = document.querySelectorAll('vercel-live-feedback, #vercel-live-indicator, [id^="__vercel"]');
            vercelElements.forEach(el => el.remove());
        }, 1000);
    </script>
</body>
</html>
