<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Chat</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Helvetica, sans-serif; background-color: #d1d7db; display: flex; height: 100vh; justify-content: center; align-items: center; }
        
        /* Gaya Layar Login */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #f0f2f5; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .btn-google { background: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 5px; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-weight: bold; margin-top: 20px; margin-left: auto; margin-right: auto; }
        .btn-google:hover { background: #357ae8; }
        .hidden { display: none !important; }

        /* Gaya Aplikasi Utama */
        .app-container { display: flex; width: 100%; max-width: 1400px; height: 100vh; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        /* Sidebar Kiri (Daftar Kontak) */
        .sidebar { width: 30%; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; background: #fff; min-width: 250px; }
        .header { height: 60px; background-color: #f0f2f5; display: flex; align-items: center; padding: 0 15px; font-weight: 600; color: #41525d; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #f2f2f2; cursor: pointer; }
        .chat-item:hover { background-color: #f5f6f6; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background-color: #dfe5e7; margin-right: 15px; flex-shrink: 0; object-fit: cover; }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 500; font-size: 16px; margin: 0 0 3px 0; color: #111b21; }
        .chat-preview { font-size: 13px; color: #667781; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0; }

        /* Ruang Obrolan Kanan */
        .chat-main { flex: 1; display: flex; flex-direction: column; background-color: #efeae2; }
        .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: contain; }
        
        /* Gelembung Pesan */
        .message { max-width: 65%; padding: 8px 12px; border-radius: 7px; font-size: 14px; position: relative; line-height: 1.4; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); }
        .message.received { background-color: #fff; align-self: flex-start; border-top-left-radius: 0; }
        .message.sent { background-color: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .msg-time { font-size: 11px; color: #667781; float: right; margin: 6px 0 -4px 10px; }

        /* Area Input Ketik Pesan */
        .chat-input-area { height: 60px; background-color: #f0f2f5; display: flex; align-items: center; padding: 0 15px; gap: 10px; }
        .chat-input-area input { flex: 1; border: none; padding: 12px 15px; border-radius: 8px; outline: none; font-size: 15px; }
        .btn-send { background-color: #00a884; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .app-container { height: 100vh; }
        }
    </style>
</head>
<body>

    <!-- Layar Login -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Selamat Datang di Web Chat</h2>
            <p>Silakan masuk untuk mulai bertukar pesan.</p>
            <button id="btn-login" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
                Login dengan Akun Google
            </button>
        </div>
    </div>

    <!-- Aplikasi Utama -->
    <div id="app-container" class="app-container hidden">
        <!-- Kolom Kiri: Daftar Kontak -->
        <div class="sidebar">
            <div class="header" id="my-profile-header">Chat Anda</div>
            <div class="chat-list">
                <!-- Kontak akan dimuat di sini oleh JavaScript -->
            </div>
        </div>

        <!-- Kolom Kanan: Ruang Obrolan -->
        <div class="chat-main">
            <div class="header" id="chat-main-header">Pilih kontak untuk mulai chat</div>
            <div class="chat-history">
                <!-- Pesan akan dimuat di sini oleh JavaScript -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Ketik pesan..." autocomplete="off"/>
                <button class="btn-send" id="btn-send">Kirim</button>
            </div>
        </div>
    </div>

    <!-- Script Firebase -->
    <script type="module">
        // 1. Kumpulkan semua Import di bagian atas
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithRedirect, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 2. Konfigurasi Firebase (JANGAN LUPA ISI INI)
        const firebaseConfig = {
            	apiKey: "AIzaSyCx4_E64FBUDyo4RzDDWMLklRlZMvMUlFM",
  		authDomain: "gombleh-9dea6.firebaseapp.com",
 		projectId: "gombleh-9dea6",
  		storageBucket: "gombleh-9dea6.firebasestorage.app",
  		messagingSenderId: "1034286098492",
  		appId: "1:1034286098492:web:87c81098f5ad465e187b39",
  		measurementId: "G-L8W6KQPCY4"
        };

        // Inisialisasi Aplikasi
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Variabel Global
        let currentUser = null;
        let currentRecipientUid = null;
        let unsubscribeChat = null;

        // Elemen DOM
        const loginScreen = document.getElementById('login-screen');
        const appContainer = document.getElementById('app-container');
        const btnLogin = document.getElementById('btn-login');
        const chatList = document.querySelector('.chat-list');
        const chatHistory = document.querySelector('.chat-history');
        const chatMainHeader = document.getElementById('chat-main-header');
        const inputMessage = document.getElementById('message-input');
        const btnSend = document.getElementById('btn-send');

        // ================= LOGIKA LOGIN & AUTH =================
        btnLogin.addEventListener('click', () => {
            signInWithRedirect(auth, provider).catch((error) => {
                console.error("Gagal login:", error);
            });
        });

        // Gabungkan onAuthStateChanged menjadi satu fungsi saja
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                appContainer.classList.remove('hidden');

                // Tampilkan foto profil sendiri di sudut kiri atas
                document.getElementById('my-profile-header').innerHTML = `
                    <img src="${user.photoURL}" style="width:30px; height:30px; border-radius:50%; margin-right:10px; object-fit:cover;"> 
                    ${user.displayName}
                `;

                // Simpan/Update data User ke Firestore
                const userRef = doc(db, "users", user.uid);
                await setDoc(userRef, {
                    uid: user.uid,
                    name: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL
                }, { merge: true });

                // Mulai muat daftar kontak
                loadContacts();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        });

        // ================= LOGIKA KONTAK =================
        function loadContacts() {
            const usersRef = collection(db, "users");
            onSnapshot(usersRef, (snapshot) => {
                chatList.innerHTML = ''; 
                snapshot.forEach((doc) => {
                    const userData = doc.data();
                    
                    if (userData.uid === currentUser.uid) return; // Jangan tampilkan diri sendiri

                    const photo = userData.photoURL || 'https://via.placeholder.com/45';
                    const chatItem = document.createElement('div');
                    chatItem.className = 'chat-item';
                    chatItem.innerHTML = `
                        <img src="${photo}" class="avatar">
                        <div class="chat-info">
                            <p class="chat-name">${userData.name}</p>
                            <p class="chat-preview">Ketuk untuk chat...</p>
                        </div>
                    `;

                    // Saat kontak diklik
                    chatItem.addEventListener('click', () => {
                        currentRecipientUid = userData.uid;
                        chatMainHeader.innerHTML = `
                            <img src="${photo}" style="width:35px; height:35px; border-radius:50%; margin-right:10px; object-fit:cover;">
                            ${userData.name}
                        `;
                        loadChatRoom(currentRecipientUid);
                    });

                    chatList.appendChild(chatItem);
                });
            });
        }

        // ================= LOGIKA OBROLAN PRIVAT =================
        function getChatId(uid1, uid2) {
            return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
        }

        function loadChatRoom(recipientUid) {
            if (unsubscribeChat) unsubscribeChat();

            const chatId = getChatId(currentUser.uid, recipientUid);
            const messagesRef = collection(db, "chats", chatId, "messages");
            const q = query(messagesRef, orderBy("timestamp", "asc"));

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                chatHistory.innerHTML = ''; 
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    
                    div.className = data.senderId === currentUser.uid ? 'message sent' : 'message received';
                    
                    const time = data.timestamp ? new Date(data.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...';
                    
                    div.innerHTML = `${data.text} <span class="msg-time">${time}</span>`;
                    chatHistory.appendChild(div);
                });
                chatHistory.scrollTop = chatHistory.scrollHeight;
            });
        }

        async function sendPrivateMessage(recipientUid, text) {
            if (!text.trim() || !recipientUid) return;

            const chatId = getChatId(currentUser.uid, recipientUid);
            const messagesRef = collection(db, "chats", chatId, "messages");

            try {
                await addDoc(messagesRef, {
                    senderId: currentUser.uid,
                    senderName: currentUser.displayName,
                    text: text,
                    timestamp: serverTimestamp()
                });
            } catch (error) {
                console.error("Gagal mengirim pesan:", error);
            }
        }

        // ================= TOMBOL KIRIM =================
        function handleSend() {
            const text = inputMessage.value;
            if (!currentRecipientUid) {
                alert("Pilih kontak terlebih dahulu dari daftar di sebelah kiri!");
                return;
            }
            sendPrivateMessage(currentRecipientUid, text);
            inputMessage.value = ''; 
            inputMessage.focus();
        }

        btnSend.addEventListener('click', handleSend);
        inputMessage.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

    </script>
</body>
</html>
